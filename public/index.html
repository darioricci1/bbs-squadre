<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Squadre BBS</title>
<link rel="icon" type="image/png" href="/logo-bbs.png">
<meta name="robots" content="noindex">
<!--
  public/index.html
  Piattaforma per formare i gruppi del project work del master BBS e
  generare idee di startup a partire dai profili delle persone.
  La versione sta in const VERSION qui sotto.
-->
<style>
  :root{
    --sfondo:#f5f6f8; --carta:#fff; --bordo:#e3e6ea; --testo:#17202a; --grigio:#667079;
    --accento:#1f5eff; --accento-chiaro:#e8efff; --verde:#1d8a4e; --verde-chiaro:#e5f5ec;
    --ambra:#a86400; --ambra-chiaro:#fff4e0; --rosso:#c5221f; --rosso-chiaro:#fdecea;
    --ombra:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.15);
  }
  /* sempre chiaro, anche sui telefoni col tema scuro */
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sfondo);color:var(--testo);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accento)}
  header{position:sticky;top:0;z-index:5;background:var(--carta);border-bottom:1px solid var(--bordo)}
  .barra{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .marchio{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
  .marchio img{width:32px;height:32px;display:block}
  @media (max-width:760px){
    .marchio small{display:none}
    header{position:static}
    .barra{padding:8px 12px;gap:6px 8px}
    .marchio{flex:1;font-size:16px}
    .marchio img{width:28px;height:28px}
    .chi{order:2}
    nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
    nav::-webkit-scrollbar{display:none}
    nav button{white-space:nowrap;padding:6px 10px}
    main table{display:block;overflow-x:auto;max-width:100%}
    .gen-persone,.proposta-riga{padding:8px 10px}
    .proposta-riga summary{gap:6px}
    .titolo-proposta{font-size:15px;flex:1 1 60%}
    .azioni-gen .btn{flex:1 1 100%}
    .pulsanti-gen{flex-wrap:nowrap}
    .pulsanti-gen{gap:8px}
    .pulsanti-gen .btn.grande{flex:1 1 0;min-width:0;justify-content:center;white-space:nowrap;font-size:clamp(11px,3.5vw,15px);padding:12px 4px;gap:4px;text-align:center}
    .pulsanti-gen .btn svg{width:17px;height:17px;flex:none}
    .pulsanti-gen .piccolo{flex:1 1 100%}
    h2{font-size:22px}
  }
  .marchio small{color:var(--grigio);font-weight:500;font-size:12px;margin-left:6px}
  nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  nav button{background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--grigio);font:inherit;cursor:pointer}
  nav button.attivo{background:var(--accento-chiaro);color:var(--accento);font-weight:600}
  .chi{font-size:13px;color:var(--grigio);display:flex;gap:8px;align-items:center}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
  .sotto{color:var(--grigio);margin:0 0 18px}
  .carta{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:16px;box-shadow:var(--ombra)}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .riga{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spazio{flex:1}
  input[type=text],input[type=search],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bordo);border-radius:9px;
    background:var(--carta);color:var(--testo);font:inherit}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  label small{font-weight:400;color:var(--grigio)}
  .btn{border:1px solid transparent;background:var(--accento-chiaro);color:var(--accento);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .1s}
  .btn:hover{border-color:var(--accento)}
  .btn:active{transform:translateY(1px)}
  .btn.primario{background:var(--accento);border-color:var(--accento);color:#fff;box-shadow:0 2px 8px rgba(31,94,255,.25)}
  .btn.primario:hover{box-shadow:0 4px 14px rgba(31,94,255,.35)}
  .btn.piccolo{padding:4px 12px;font-size:13px}
  .btn.piccolo:not(.primario):not(.pericolo){color:var(--accento)}
  .btn.piccolo.primario{color:#fff}
  .btn.pericolo{background:var(--rosso-chiaro);color:var(--rosso)}
  .btn.pericolo:hover{border-color:var(--rosso)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
  #secBacheca .idea.mia .btn:not(.primario):not(.pericolo),.domanda-gen.aperta .btn:not(.primario){background:rgba(31,94,255,.14)}
  .etichetta{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accento-chiaro);color:var(--accento);margin:2px 4px 2px 0}
  .etichetta.verde{background:var(--verde-chiaro);color:var(--verde)}
  .etichetta.ambra{background:var(--ambra-chiaro);color:var(--ambra)}
  .etichetta.grigia{background:var(--sfondo);color:var(--grigio);border:1px solid var(--bordo)}
  .persona{display:flex;flex-direction:column;gap:6px;position:relative}
  .persona.scelta{outline:2px solid var(--accento)}
  .persona .testa{display:flex;gap:10px;align-items:center}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--accento-chiaro);color:var(--accento);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .nome{font-weight:650}
  .piccolo{font-size:13px;color:var(--grigio)}
  .az{font-size:12.5px;background:var(--sfondo);border-radius:8px;padding:6px 8px;color:var(--grigio)}
  .idea h3{margin:0 0 6px;font-size:17px}
  .idea dl{margin:8px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
  .idea dt{color:var(--grigio)}
  .idea dd{margin:0}
  .avviso{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
  .avviso.male{background:var(--rosso-chiaro);color:var(--rosso)}
  .avviso.bene{background:var(--verde-chiaro);color:var(--verde)}
  .avviso.info{background:var(--accento-chiaro);color:var(--accento)}
  .porta{max-width:440px;margin:60px auto;text-align:center}
  #pulsante{display:flex;justify-content:center;min-height:44px;margin:18px 0}
  .lista-persone{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;overflow:hidden;box-shadow:var(--ombra)}
  .riga-persona{border-bottom:1px solid var(--bordo);cursor:pointer}
  .riga-persona:last-child{border-bottom:0}
  .riga-persona:hover{background:var(--sfondo)}
  .riga-persona.scelta{box-shadow:inset 3px 0 0 var(--accento)}
  .rp-testa{display:flex;align-items:center;gap:12px;padding:9px 14px}
  .piccolo-av{width:34px;height:34px;font-size:13px}
  .rp-nome{flex:1;min-width:0}
  .rp-lavoro{font-size:13px;color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-trovato{font-size:12.5px;color:var(--grigio);margin-top:2px}
  .rp-trovato mark{background:var(--ambra-chiaro);color:var(--testo);padding:0 2px;border-radius:3px}
  .rp-etichette{flex:none;max-width:34%;text-align:right}
  .rp-azioni{flex:none;display:flex;align-items:center;gap:10px}
  .rp-freccia{color:var(--grigio);width:12px}
  .rp-dettagli{margin:0;padding:4px 14px 14px 60px;display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px;cursor:default}
  .rp-dettagli dt{color:var(--grigio)}
  .rp-dettagli dd{margin:0;white-space:pre-line}
  @media (max-width:760px){.rp-etichette{display:none}.rp-dettagli{padding-left:14px;grid-template-columns:1fr}.rp-dettagli dt{margin-top:6px}}
  .chi-sei{max-width:560px;margin:30px auto}
  .completa{position:relative}
  .completa input{font-size:17px;padding:12px 14px}
  .suggerimenti{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--carta);border:1px solid var(--bordo);border-top:0;border-radius:0 0 10px 10px;box-shadow:var(--ombra);overflow:hidden}
  .suggerimenti:empty{display:none}
  .sugg{padding:9px 14px;cursor:pointer;border-top:1px solid var(--bordo)}
  .sugg.attivo{background:var(--accento-chiaro)}
  .sugg.preso{color:var(--grigio);cursor:default}
  .solo-largo{}
  @media (max-width:760px){.solo-largo{display:none}}
  .sezione-genera{margin-top:0;padding-top:0}
  .finestra-genera .sezione-genera h2{margin-top:0}
  .motore{position:relative;padding-top:20px}
  .motore h3{margin:0 0 4px}
  .motore-n{position:absolute;top:-14px;left:16px;width:28px;height:28px;border-radius:50%;background:var(--accento);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--bordo);border-radius:10px;padding:6px;background:var(--carta)}
  .picker-campo{flex:1;min-width:160px}
  .picker-campo input{border:0;padding:6px;font-size:15px}
  .picker-campo input:focus{outline:none}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--accento-chiaro);color:var(--accento);border-radius:99px;padding:3px 4px 3px 10px;font-size:13.5px}
  .chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
  .spunta{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:6px 16px 0 0;cursor:pointer}
  .idea.selezionata{outline:2px solid var(--accento)}
  .idea.riservata{border-color:var(--ambra)}
  .riservata-nota{font-size:12.5px;color:var(--ambra);background:var(--ambra-chiaro);border-radius:8px;padding:4px 8px;margin-top:8px}
  .descr{white-space:pre-wrap}
  .sotto-idea{border-top:1px solid var(--bordo);padding:6px 0}
  .sotto-idea summary{cursor:pointer}
  .finestra.finestra-genera{width:min(1180px,100%,calc((100vh - 300px) * 3 + 110px));position:relative;padding-top:14px}
  .finestra-genera .sotto{margin:2px 0 0;font-size:14px}
  .finestra-genera .percorso-gen{margin-top:8px;padding:14px}
  .finestra-genera .domande-riga{margin-top:0}
  .cucina{position:absolute;inset:0;z-index:5;border-radius:inherit;background:rgba(255,255,255,.93);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  .padella{font-size:72px;animation:salta 1.1s ease-in-out infinite;transform-origin:50% 80%}
  @keyframes salta{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-12deg)}60%{transform:translateY(0) rotate(8deg)}}
  .frase-cucina{font-size:20px;font-weight:600;max-width:560px;min-height:56px}
  .frase-cucina.entra{animation:entra .45s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .barra-cucina{width:min(420px,80%);height:8px;border-radius:99px;background:var(--bordo);overflow:hidden}
  .barra-cucina span{display:block;height:100%;width:0;background:var(--accento);border-radius:99px;animation:riempi 55s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes riempi{to{width:95%}}
  .vista-idea dl{margin:8px 0 0}
  .vista-idea dt{font-weight:600;margin-top:8px}
  .vista-idea dd{margin:2px 0 0;white-space:pre-wrap}
  .meta-idea{margin:2px 0 6px}
  .sintesi-vista{margin:6px 0;white-space:pre-wrap}
  .titolo-vista{margin:4px 0}
  .penna{border:0;background:none;cursor:pointer;color:var(--accento);font-size:15px;padding:0 4px;margin-left:4px;opacity:.75}
  .penna:hover{opacity:1}
  .vuoto{color:var(--grigio);font-style:italic}
  .campo-aperto{display:flex;gap:6px;align-items:flex-start;width:100%}
  .campo-aperto input,.campo-aperto textarea,.campo-aperto select{flex:1;margin:0}
  .barre-penna{display:flex;align-items:flex-start;gap:4px}
  .barre-penna .criteri{flex:1}
  .criterio input[type=range]{width:100%}
  .campo-lav{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:8px;align-items:start}
  .etichetta-lav{font-size:13px;font-weight:600;color:var(--grigio);padding-top:1px}
  .valore-lav{white-space:pre-wrap;overflow-wrap:anywhere}
  .testo-lungo{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .testo-lungo.aperto{display:inline;-webkit-line-clamp:unset}
  @media (max-width:760px){.campo-lav{grid-template-columns:1fr;gap:2px}}
  .griglia-annunci{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .annuncio{display:flex;flex-direction:column;gap:6px}
  .annuncio.mio{border:2px solid var(--accento);background:var(--accento-chiaro)}
  .annuncio textarea{margin:0;background:#fff}
  .testo-annuncio{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .linguette-regia{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--bordo);margin:14px 0 16px}
  .linguette-regia button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;color:var(--grigio);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .linguette-regia button.attiva{color:var(--accento);border-bottom-color:var(--accento)}
  .linguette-regia button .piccolo{background:var(--accento-chiaro);color:var(--accento);border-radius:99px;padding:1px 7px;margin-left:4px}
  @media (max-width:760px){.linguette-regia{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
  .annuncio-riga{flex-wrap:nowrap;gap:8px;margin:0 0 16px;background:var(--accento-chiaro);border:1px solid #b9ccff;border-radius:14px;padding:8px 10px 8px 14px}
  .annuncio-riga input{flex:1;margin:0;min-width:0;border:0;background:#fff}
  .annuncio-riga > .piccolo b{color:var(--accento)}
  .annuncio-riga .facoltativo{color:var(--grigio);font-weight:400}
  .annuncio-riga > .piccolo{white-space:nowrap}
  .annuncio-riga.pubblicato{background:var(--accento-chiaro);border-color:var(--accento)}
  .annuncio-riga .testo-annuncio{min-width:0;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){.annuncio-riga{flex-wrap:wrap}.annuncio-riga > .piccolo{flex:1 1 100%}.annuncio-riga input{flex:1 1 0}}
  .precedenti{margin-top:24px}
  .precedenti > summary{cursor:pointer;font-weight:600;font-size:17px;margin-bottom:10px}
  .chiudi-genera{position:absolute;top:12px;right:12px;z-index:2}
  .avviso-versione{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:var(--testo,#111);color:#fff;padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px}
  .velo{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px}
  .velo > .finestra{margin:auto}
  .finestra{background:var(--carta);color:var(--testo);border-radius:16px;padding:20px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .blocco-idea{border:1px solid var(--bordo);border-radius:12px;padding:12px;margin-top:12px}
  body.bloccato{overflow:hidden}
  .burger,.solo-stretto{display:none}
  .riga-crediti{margin:6px 0 0;align-items:center}
  @media (max-width:760px){
    .burger{display:block;border:0;background:var(--accento-chiaro);color:var(--accento);font-size:20px;width:40px;height:40px;border-radius:12px;cursor:pointer;order:2;margin-left:auto}
    .marchio{order:0}
    nav{display:none !important}
    header.menu-aperto nav{display:flex !important;flex-direction:column;align-items:stretch;order:4;flex:0 0 100%;margin:4px 0 0;padding:6px 0;border-top:1px solid var(--bordo)}
    header.menu-aperto nav button{text-align:left;padding:12px 10px;font-size:16px}
    header.menu-aperto nav .solo-stretto{display:block}
    .chi{display:none !important}
    .menu-sotto{border-top:1px solid var(--bordo);margin-top:6px;padding-top:6px}
    .menu-sotto button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 10px;font:inherit;font-size:16px;color:var(--grigio);cursor:pointer}
    body.genera-pagina main{display:none}
    body.genera-pagina.bloccato{overflow:auto}
    body.genera-pagina #veloGenera{position:static;background:none;padding:0;display:block;overflow:visible;z-index:auto}
    body.genera-pagina #veloGenera > .finestra{width:100%;border-radius:0;box-shadow:none;padding:14px 12px 40px;background:transparent;margin:0}
    body.genera-pagina .chiudi-genera{display:none}
  }
  .regia-gen{margin-bottom:12px}
  .regia-gen table td,.regia-gen table th{padding:5px 8px}
  .tour-velo{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.55)}
  .tour-anello{position:fixed;z-index:30;border-radius:12px;box-shadow:0 0 0 3px var(--accento),0 0 0 9999px rgba(10,15,25,.55);pointer-events:none;transition:all .2s}
  .tour-fumetto{position:fixed;z-index:31;width:min(340px,calc(100vw - 20px));background:var(--carta);color:var(--testo);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .tour-fumetto::before{content:"";position:absolute;top:-8px;left:calc(50% - 8px);border:8px solid transparent;border-top:0;border-bottom-color:var(--carta)}
  .tour-fumetto.sopra::before{top:auto;bottom:-8px;border-bottom:0;border-top:8px solid var(--carta)}
  .tour-fumetto.al-centro{top:50%;left:50%;transform:translate(-50%,-50%)}
  .tour-fumetto.al-centro::before{display:none}
  .tour-testo{margin-top:4px;line-height:1.45}
  .picker-scatola{position:relative}
  .picker-chip{display:contents}
  .picker-freccia{border:0;background:none;color:var(--grigio);cursor:pointer;font-size:16px;padding:0 6px}
  .chip-io{background:var(--accento);color:#fff;padding-right:10px}
  .voce-io{background:var(--accento-chiaro);cursor:default}
  .elenco-persone{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--carta);border:1px solid var(--bordo);border-radius:10px;box-shadow:var(--ombra);max-height:300px;overflow-y:auto}
  @media (max-width:760px){.elenco-persone{max-height:45vh}body.picker-aperto{padding-bottom:100vh}}
  .elenco-testa{position:sticky;top:0;background:var(--carta);display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bordo)}
  .voce-persona{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--bordo);font-weight:400;margin:0}
  .voce-persona:last-child{border-bottom:0}
  .voce-persona.attivo,.voce-persona:hover{background:var(--accento-chiaro)}
  .voce-persona input{margin-top:3px;flex:none}
  .criteri{margin:8px 0;display:grid;gap:3px}
  .criterio{display:grid;grid-template-columns:170px 1fr 24px;align-items:center;gap:8px;font-size:12.5px;color:var(--grigio)}
  .criterio .livello{display:block;height:6px;border-radius:3px;background:var(--accento-chiaro);overflow:hidden}
  .criterio .livello span{display:block;height:6px;background:var(--accento)}
  .criterio b{color:var(--testo);text-align:right}
  .criteri-titolo{font-size:12px;font-weight:600;color:var(--testo);margin-top:2px}
  .criterio.debole .livello span{background:var(--ambra)}
  .domande{margin-top:8px;border-top:1px solid var(--bordo);padding-top:6px}
  .domande summary{cursor:pointer;font-weight:600;font-size:14px}
  .slide-bozza{margin-top:10px;border-top:1px solid var(--bordo);padding-top:8px}
  .slide-bozza summary{cursor:pointer;font-weight:600;font-size:14px}
  .slide{border:1px solid var(--bordo);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--sfondo)}

<body>
<header id="testata"><div class="barra">
  <button id="burger" class="burger" aria-label="Menu">☰</button>
  <div class="marchio"><img src="/logo-bbs.png" alt="Bologna Business School">Squadre BBS <small>project work</small></div>
  <nav id="nav"></nav>
  <div class="chi" id="chi"></div>
</div></header>
<main id="main"><div class="caricamento">Caricamento…</div></main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
const VERSION = "2.38.2";
const $main = document.getElementById("main");
const S = { selezInit: {}, linguette: {}, tolti: {}, risposte: { idea: false, compagni: false, paletti: false }, opz: { modello: "", perno: "", settore: "" }, aperti: new Set(), dati: null, scheda: "bacheca", scelti: new Set(), selezione: new Set(), filtro: "", ultima: null,
  stat: null, generando: false, comeUtente: memoria("bbs-come-utente") === "1" };

// ---------------------------------------------------------------- utilita'
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iniziali = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0].toUpperCase()).join("");
const quando = (t) => t ? new Date(t).toLocaleString("it-IT", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

async function api(azione, corpo, url) {
  const headers = S.comeUtente ? { "x-bbs-come-utente": "1" } : {};
  const r = await fetch(url || ("/api/bbs?a=" + azione), corpo === undefined ? { headers } : {
    method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  let j = {};
  try { j = await r.json(); } catch {}
  // sessione scaduta mentre si usa il sito: si torna all'accesso
  if (r.status === 401 && S.dati) { S.dati = null; porta(); }
  if (!r.ok) { const e = new Error(j.error || ("HTTP " + r.status)); e.stato = r.status; throw e; }
  return j;
}
function avvisa(dove, testo, tipo) {
  const el = typeof dove === "string" ? document.getElementById(dove) : dove;
  if (el) el.innerHTML = testo ? `<div class="avviso ${tipo || "info"}">${esc(testo)}</div>` : "";
}
const profilo = (id) => S.dati.profili.find((p) => p.id === id);
const mio = () => S.dati.io.profilo && profilo(S.dati.io.profilo);
// Il profilo aperto nella scheda: il mio, o quello di un altro che
// l'amministratore sta completando (dalle statistiche).
const altrui = () => !!(S.profiloAltrui && S.dati.io.admin && profilo(S.profiloAltrui));
const profiloInModifica = () => (altrui() ? profilo(S.profiloAltrui) : mio());
const perChi = () => (altrui() ? { profilo: S.profiloAltrui } : {});

// ---------------------------------------------------------------- avvio
async function carica() {
  try {
    S.dati = await api("dati");
    if (location.hash === "#importa" && S.dati.io.admin) S.scheda = "importa";
    disegna();
  } catch (e) {
    if (e.stato === 401) return porta();
    $main.innerHTML = `<div class="avviso male">${esc(e.message)}</div>`;
  }
}

function porta() {
  // Sessione assente o scaduta: via la pagina Genera (sul telefono coprirebbe
  // l'accesso) e via il menu, che senza accesso resterebbe vuoto.
  if (document.getElementById("veloGenera")) { S.generaAperta = false; document.getElementById("veloGenera").remove(); }
  document.body.classList.remove("genera-pagina", "bloccato", "picker-aperto");
  document.getElementById("testata").classList.remove("menu-aperto");
  document.getElementById("burger").style.display = "none";
  document.getElementById("nav").innerHTML = "";
  document.getElementById("chi").innerHTML = "";
  $main.innerHTML = `<div class="porta carta">
    <img src="/logo-bbs.png" alt="Bologna Business School" style="width:84px;height:84px;display:block;margin:0 auto 10px">
    <h2>Squadre BBS</h2>
    <p class="sotto">Trova con chi fare il project work e genera idee di startup a partire dai profili del master.</p>
    <div id="pulsante"></div><div id="msgPorta"></div>
  </div>`;
  api("config").then((c) => {
    if (!c.clientId) return avvisa("msgPorta", "Manca GOOGLE_CLIENT_ID fra le variabili d'ambiente su Vercel.", "male");
    const t = setInterval(() => {
      if (!(window.google && google.accounts && google.accounts.id)) return;
      clearInterval(t);
      google.accounts.id.initialize({ client_id: c.clientId, callback: (r) => {
        avvisa("msgPorta", "Un momento…");
        api("entra", { credential: r.credential }).then(carica).catch((e) => avvisa("msgPorta", e.message, "male"));
      } });
      google.accounts.id.renderButton(document.getElementById("pulsante"), { theme: "outline", size: "large", text: "signin_with", locale: "it", width: 300 });
    }, 120);
  }).catch((e) => avvisa("msgPorta", e.message, "male"));
}

// ---------------------------------------------------------------- struttura
// Chi usa la piattaforma vede due schede: la Bacheca (la home, con sotto i
// due motori che generano le idee) e il proprio profilo. L'amministratore ha
// in piu' Regia e Statistiche; Importa si apre da /#importa.
const SCHEDE = [["bacheca", "Bacheca"], ["spunti", "Spunti"], ["profilo", "Il mio profilo"]];
const SCHEDE_ADMIN = [["regia", "Regia"], ["aziende", "Aziende"]];
const SOLO_ADMIN = ["regia", "aziende", "statistiche", "importa"];

function disegna() {
  const d = S.dati;
  if (!d.io.admin && SOLO_ADMIN.includes(S.scheda)) S.scheda = "bacheca";
  if (!d.io.profilo && !(d.io.admin && SOLO_ADMIN.includes(S.scheda))) S.scheda = "profilo";
  const schede = SCHEDE.concat(d.io.admin ? SCHEDE_ADMIN : []);
  const attiva = (k) => S.scheda === k || (k === "bacheca" && ["genera", "persone"].includes(S.scheda));
  document.getElementById("burger").style.display = "";
  document.getElementById("nav").innerHTML = `<button data-apri-genera class="solo-stretto ${S.generaAperta ? "attivo" : ""}">Genera idee</button>` + schede.map(([k, t]) =>
    `<button data-scheda="${k}" class="${attiva(k) && !S.generaAperta ? "attivo" : ""}">${t}</button>`).join("") +
    // sul telefono il menu ☰ contiene anche i pulsanti di destra
    `<div class="menu-sotto solo-stretto">
      <button data-clic="aiuto">Come funziona</button>
      ${d.io.adminVero ? `<button data-clic="modoUtente">${d.io.admin ? "Vedi come utente" : "Torna amministratore"}</button>` : ""}
      <button data-clic="esci">Esci <span class="piccolo">${esc(d.io.email)}</span></button></div>`;
  document.getElementById("chi").innerHTML = `
    ${d.io.adminVero ? `<button class="btn piccolo" id="modoUtente" title="Usa la piattaforma come un collega qualsiasi">${d.io.admin ? `<span class="solo-largo">Vedi come </span>utente` : `<span class="solo-largo">Torna </span>admin`}</button>` : ""}
    <button class="btn piccolo" id="aiuto" title="Il tutorial">Come funziona</button>
    <span class="solo-largo">${esc(d.io.email)}</span><button class="btn piccolo" id="esci">Esci</button>`;
  const viste = { bacheca: () => home(false), genera: () => home(true), persone, spunti, profilo: schedaProfilo, regia, aziende, statistiche: regia, importa };
  (viste[S.scheda] || viste.bacheca)();
  if (S.comeUtente) $main.insertAdjacentHTML("afterbegin", `<div class="avviso info riga" style="margin-top:0">
    <span>Stai usando la piattaforma <b>come un utente qualsiasi</b>: niente Regia, bacheca e crediti come li vedono i colleghi.</span>

function registraStoria() {
  if (S.daStoria || !S.dati) return;

  if (!history.state || !history.state.scheda) return history.replaceState(st, "");

}
window.addEventListener("popstate", (ev) => {

  if (!st || !st.scheda || !S.dati) return;

function memoria(k, v) {

// Scelta di persone: cliccando si apre l'elenco di tutti in ordine
// alfabetico, con una casella da spuntare per ciascuno (se ne scelgono quante
// si vuole, l'elenco resta aperto). Scrivendo l'elenco si restringe; quando
// resta una sola persona, Invio la spunta. Serve per il gruppo del motore 1 e
// per decidere con chi condividere un'idea.
// conMe: io sono sempre nel gruppo, spuntato e non toglibile, cosi' nessuno
// pensa di esserne fuori.
function pickerPersone(box, scelti, alCambio, segnaposto, massimo, conMe) {
  const io = S.dati.io.profilo;
  const tutti = S.dati.profili.filter((p) => p.id !== io)
    .sort((x, y) => String(x.nome).localeCompare(String(y.nome), "it", { sensitivity: "base" }));
  let trovati = [], sel = 0, aperto = false;
  box.innerHTML = `<div class="picker-scatola">
    <div class="picker"><span class="picker-chip"></span>
      <div class="picker-campo"><input type="text" data-tour="pick" placeholder="${esc(segnaposto || "Clicca per scegliere, o scrivi un nome…")}" autocomplete="off"></div>
      <button type="button" class="picker-freccia" aria-label="Apri l'elenco">▾</button></div>
    <div class="elenco-persone" hidden></div></div>`;
  const inp = box.querySelector("input"), elenco = box.querySelector(".elenco-persone"), chip = box.querySelector(".picker-chip");
  const cambiato = () => { disegnaChip(); if (aperto) disegnaElenco(); alCambio && alCambio(); };
  const disegnaChip = () => {
    chip.innerHTML = [...scelti].map((id) => `<span class="chip">${esc((profilo(id) || {}).nome || "?")}<button type="button" data-via="${id}" aria-label="Togli">×</button></span>`).join("");
    chip.querySelectorAll("[data-via]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); scelti.delete(b.dataset.via); cambiato(); }; });
  };
  const disegnaElenco = () => {
    const parole = senzaAccenti(inp.value).split(/[\s'’-]+/).filter(Boolean);
    trovati = tutti.filter((p) => parole.every((w) => senzaAccenti(p.nome).split(/[\s'’,.-]+/).some((x) => x.startsWith(w))));
    if (sel >= trovati.length) sel = Math.max(0, trovati.length - 1);
    // io compaio al mio posto in ordine alfabetico, spuntato e bloccato
    const me = conMe && mio();
    const trovoMe = me && parole.every((w) => senzaAccenti(me.nome).split(/[\s'’,.-]+/).some((x) => x.startsWith(w)));
    const rigaMe = trovoMe ? `<label class="voce-persona voce-io"><input type="checkbox" checked disabled>
        <span><b>${esc(me.nome)}</b> <span class="piccolo">(tu) · ci sei sempre</span></span></label>` : "";
    let messo = !rigaMe;
    const righe = trovati.map((p, i) => {
      const prima = !messo && String(me.nome).localeCompare(String(p.nome), "it", { sensitivity: "base" }) < 0 ? (messo = true, rigaMe) : "";
      return prima + `<label class="voce-persona ${i === sel ? "attivo" : ""}" data-i="${i}">
        <input type="checkbox" ${scelti.has(p.id) ? "checked" : ""} ${massimo && scelti.size >= massimo && !scelti.has(p.id) ? "disabled" : ""}>
        <span><b>${esc(p.nome)}</b> <span class="piccolo">${esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || (p.titolo || "").slice(0, 60))}</span></span></label>`;
    }).join("") + (messo ? "" : rigaMe);
    elenco.innerHTML = (massimo && scelti.size >= massimo ? `<div class="voce-persona piccolo">Hai già scelto ${massimo} persone, il massimo: per aggiungerne una, togline un'altra.</div>` : "") +
      (righe || '<div class="voce-persona piccolo">Nessun nome così.</div>');
    elenco.querySelectorAll(".voce-persona[data-i]").forEach((el) => {
      el.querySelector("input").onchange = (e) => {
        const p = trovati[Number(el.dataset.i)];
        if (e.target.checked) scelti.add(p.id); else scelti.delete(p.id);
        sel = Number(el.dataset.i);
        cambiato(); inp.focus();
      };
    });
    const fatto = elenco.querySelector("[data-fatto]");
    if (fatto) fatto.onclick = () => chiudi();
    const att = elenco.querySelector(".voce-persona.attivo");
    if (att) att.scrollIntoView({ block: "nearest" });
  };
  // Sul telefono il campo sale in cima allo schermo: sotto resta spazio per l'elenco.
  const apri = () => {
    if (aperto) return; aperto = true; elenco.hidden = false; disegnaElenco();
    if (matchMedia("(max-width:760px)").matches && !box.closest(".velo:not(#veloGenera)")) {
      document.body.classList.add("picker-aperto");   // spazio in fondo, perche' la pagina possa salire
      setTimeout(() => window.scrollTo({ top: box.getBoundingClientRect().top + window.scrollY - 8, behavior: "smooth" }), 250);
    }
  };
  const chiudi = () => { aperto = false; elenco.hidden = true; inp.value = ""; document.body.classList.remove("picker-aperto"); };
  const spunta = (p) => { if (scelti.has(p.id)) scelti.delete(p.id); else if (!massimo || scelti.size < massimo) scelti.add(p.id); cambiato(); };
  inp.onfocus = apri;
  inp.onclick = apri;
  box.querySelector(".picker-freccia").onclick = () => { if (aperto) chiudi(); else { apri(); inp.focus(); } };
  inp.oninput = () => { sel = 0; apri(); disegnaElenco(); };
  inp.onkeydown = (e) => {
    if (e.key === "Escape") { chiudi(); inp.blur(); return; }
    if (e.key === "Backspace" && !inp.value && scelti.size) { scelti.delete([...scelti].pop()); cambiato(); return; }
    if (!aperto) apri();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!trovati.length) return;
      sel = (sel + (e.key === "ArrowDown" ? 1 : trovati.length - 1)) % trovati.length;
      disegnaElenco();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!trovati.length) return;
      spunta(trovati[trovati.length === 1 ? 0 : sel]);
      if (trovati.length === 1) { inp.value = ""; sel = 0; disegnaElenco(); }
    }
  };
  // clic fuori: si chiude
  const fuori = (e) => { if (!box.isConnected) return document.removeEventListener("mousedown", fuori); if (aperto && !box.contains(e.target)) chiudi(); };
  document.addEventListener("mousedown", fuori);
  disegnaChip();
}

// ---------------------------------------------------------------- persone
// Una persona per riga: nome, lavoro e i pulsanti sempre visibili; il resto
// si apre cliccando sulla riga. Quando si cerca, sotto il nome compare il
// pezzo di profilo che ha fatto trovare la persona.
function rigaPersona(p) {
  const x = p.extra || {}, az = p.aziendaInfo;
  const scelto = S.scelti.has(p.id), sonoIo = p.id === S.dati.io.profilo, aperta = S.aperti.has(p.id);
  const lavoro = [p.ruolo, p.azienda].filter(Boolean).join(" · ") || p.titolo || "";

    (x.settori || "").split(/[,;]/).filter((t) => t.trim()).slice(0, 2).map((t) => `<span class="etichetta grigia">${esc(t.trim())}</span>`).join("") +
    (!p.rivendicato ? '<span class="etichetta grigia">non ancora entrato</span>' : "");
  const dett = (et, v) => v ? `<dt>${et}</dt><dd>${esc(v)}</dd>` : "";
  return `<div class="riga-persona ${scelto ? "scelta" : ""}" data-apri="${p.id}">
    <div class="rp-testa">
      <div class="avatar piccolo-av">${p.foto ? `<img src="${esc(p.foto)}" alt="" referrerpolicy="no-referrer">` : esc(iniziali(p.nome))}</div>
      <div class="rp-nome"><div><b>${esc(p.nome)}</b> ${sonoIo ? '<span class="etichetta verde">tu</span>' : ""}</div>
        <div class="rp-lavoro">${esc(lavoro)}</div>
        ${trovato ? `<div class="rp-trovato">…${trovato}…</div>` : ""}</div>
      <div class="rp-etichette">${etichette}</div>
      <div class="rp-azioni">
        ${p.linkedin ? `<a class="piccolo" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
        ${!sonoIo ? `<button class="btn piccolo ${scelto ? "primario" : ""}" data-scegli="${p.id}">${scelto ? "Nel gruppo ✓" : "+ Gruppo"}</button>` : ""}
        <span class="rp-freccia">${aperta ? "▴" : "▾"}</span>
      </div>
    </div>
    ${aperta ? `<dl class="rp-dettagli">
      ${dett("Headline", p.titolo)}${dett("Città", p.citta)}
      ${az ? dett("Azienda (AIDA)", [az.settore || az.ateco, az.fatturato && "fatturato " + az.fatturato, az.dipendenti && az.dipendenti + " dipendenti"].filter(Boolean).join(" · ")) : ""}
      ${dett("Competenze", p.competenze)}${dett("Passioni", x.passioni)}${dett("Settori", x.settori)}
      ${dett("Ruolo nel team", x.ruoloNelTeam)}${dett("Cosa cerca", x.cosaCerco)}${dett("Idee", x.ideeMie)}
      ${p.lavori && p.lavori.length ? `<dt>Esperienze</dt><dd>${p.lavori.slice(0, 8).map((l) => `<div class="persona-lavoro"><b>${esc(l.ruolo)}</b> @ ${l.sito ? `<a href="${esc(l.sito)}" target="_blank" rel="noopener">${esc(l.azienda)}</a>` : esc(l.azienda)}
          <span class="piccolo">${esc(l.periodo.replace(/\s*\(.*\)$/, ""))}${l.settore ? " · " + esc(l.settore) : ""}</span>
          ${l.descrizioneAzienda ? `<div class="piccolo">${esc(l.descrizioneAzienda)}</div>` : ""}
          ${l.descrizioneRuolo ? `<div class="piccolo">${esc(l.descrizioneRuolo.slice(0, 280))}${l.descrizioneRuolo.length > 280 ? "…" : ""}</div>` : ""}</div>`).join("")}</dd>`
        : dett("Esperienze", (p.esperienze || "").slice(0, 600) + ((p.esperienze || "").length > 600 ? "…" : ""))}
      ${dett("Formazione", p.formazione)}
    </dl>` : ""}
  </div>`;
}

// Il pezzetto di testo dove compare la prima parola cercata, con la parola
// evidenziata: serve a capire perche' una persona e' nei risultati.
function dovePersona(p, filtro) {
  const w = senzaAccenti(filtro).split(/\s+/).filter(Boolean)[0];
  if (!w) return "";
  const re = new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const x = p.extra || {};
  for (const campo of [p.nome, p.ruolo, p.azienda, p.titolo, p.competenze, x.passioni, x.settori, x.cosaCerco, p.esperienze, p.formazione, p.linkedinTesto]) {
    const t = String(campo || "").replace(/\s+/g, " ");
    const m = re.exec(senzaAccenti(t));
    if (!m) continue;
    const i = m.index + m[1].length;
    const da = Math.max(0, i - 50), a = Math.min(t.length, i + w.length + 60);
    return esc(t.slice(da, i)) + "<mark>" + esc(t.slice(i, i + w.length)) + "</mark>" + esc(t.slice(i + w.length, a));
  }
  return "";
}

// La ricerca vuole parole che INIZIANO come quelle scritte: "ducati" trova
// Ducati ma non "education". Con piu' parole, devono esserci tutte.
const senzaAccenti = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function trovaPersona(filtro) {
  const parole = senzaAccenti(filtro).split(/\s+/).filter(Boolean)
    .map((w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")));
  if (!parole.length) return () => true;
  return (p) => {
    const x = p.extra || {}, a = p.aziendaInfo || {};
    const testo = senzaAccenti([p.nome, p.titolo, p.ruolo, p.azienda, p.citta, p.competenze, p.esperienze, p.formazione,
      p.linkedinTesto, x.passioni, x.preferenza, x.settori, x.ruoloNelTeam, x.cosaCerco, x.ideeMie, a.settore, a.ateco].join(" \n "));
    return parole.every((re) => re.test(testo));
  };
}

function persone() {
  const lista = S.dati.profili.filter(trovaPersona(S.filtro));
  $main.innerHTML = `<p style="margin:0 0 8px"><a href="#" data-scheda="genera">← Torna a Genera idee</a></p><h2>Persone del master</h2>
    <p class="sotto">${S.dati.profili.length} profili. Cerca per nome, azienda, settore o passione, e aggiungi al gruppo chi vuoi coinvolgere.</p>
    <input type="search" id="cerca" placeholder="Cerca: calcio, fintech, B2B, Ducati…" value="${esc(S.filtro)}">
    <p class="piccolo" style="margin:10px 0 6px">${S.filtro.trim() ? lista.length + " su " + S.dati.profili.length + " · " : ""}Clicca su una riga per vedere il profilo.</p>
    <div class="lista-persone">${lista.map(rigaPersona).join("") || '<p class="piccolo" style="padding:14px">Nessun profilo.</p>'}</div>
    ${barraScelti()}`;
  const c = document.getElementById("cerca");
  c.addEventListener("input", () => { S.filtro = c.value; const pos = c.selectionStart; persone(); const n = document.getElementById("cerca"); n.focus(); n.setSelectionRange(pos, pos); });
}
function barraScelti() {
  if (!S.scelti.size) return "";
  return `<div class="carta scelti riga"><b>Gruppo:</b> ${[...S.scelti].map((id) => `<span class="etichetta">${esc((profilo(id) || {}).nome)}</span>`).join("")}

document.addEventListener("click", (ev) => {

// Mentre l'AI lavora: una sovrimpressione con la padella e frasi che cambiano.
const FRASI_CUCINA = ["What's cooking, good looking? 👀"];
function mostraCucina() {

// Le persone di una generazione, tutte insieme: chi l'ha generata, chi aveva
// scelto e chi ha proposto Claude, con il ruolo, il motivo e le idee per cui
// e' stato proposto.
function personeGen(g) {
  const tutte = new Map();
  const metti = (id, dati) => {
    if (!profilo(id)) return;
    const x = tutte.get(id) || { id, nome: profilo(id).nome, ruoli: [], motivi: [], idee: [], scelto: false, io: false };
    if (dati.ruolo && !x.ruoli.includes(dati.ruolo)) x.ruoli.push(dati.ruolo);
    if (dati.motivo && !x.motivi.includes(dati.motivo)) x.motivi.push(dati.motivo);
    if (dati.idea != null && !x.idee.includes(dati.idea)) x.idee.push(dati.idea);
    if (dati.scelto) x.scelto = true;
    if (dati.io) x.io = true;
    tutte.set(id, x);
  };
  metti(g.autore, { io: true });
  (g.persone || []).forEach((id) => metti(id, { scelto: true }));
  g.idee.forEach((i, n) => {
    (i.ruoli || []).forEach((r) => metti(r.id, { ruolo: r.ruolo, idea: tutte.has(r.id) && (tutte.get(r.id).scelto || tutte.get(r.id).io) ? null : n }));
    (i.compagni || []).forEach((c) => metti(c.id, { motivo: c.motivo, idea: n }));
  });
  return [...tutte.values()].sort((a, b) => (b.io - a.io) || (b.scelto - a.scelto) || (b.idee.length - a.idee.length) || a.nome.localeCompare(b.nome));
}

// Barre da 1 a 10; sotto 6 la barra diventa ambra, perche' e' sotto la soglia.
function barreCriteri(titolo, voci) {
  return `<div class="criteri">${titolo ? `<div class="criteri-titolo">${esc(titolo)}</div>` : ""}${voci.map(([t, v]) => {
    const n = Math.max(0, Math.min(10, Number(v) || 0));
    return `<div class="criterio ${n < 6 ? "debole" : ""}"><span>${t}</span><span class="livello"><span style="width:${n * 10}%"></span></span><b>${esc(v)}</b></div>`;
  }).join("")}</div>`;
}

    const k = S.dati.generazioni.findIndex((x) => x.id === gid);
    if (k >= 0) S.dati.generazioni[k] = g;
    if (S.ultima && S.ultima.id === gid) S.ultima = g;
    const y = window.scrollY;
    genera();
    const d = document.querySelector(`details[data-gen="${gid}"]`);
    if (d) { d.open = true; d.querySelector("div").innerHTML = risultati(g, true); }
    window.scrollTo(0, y);
  } catch (e) { b.disabled = false; b.textContent = "Non è andata: " + e.message + " Riprova"; }
});

function ideaGenerata(k) {
  const [gid, n] = k.split("|");
  const g = S.dati.generazioni.find((x) => x.id === gid) || (S.ultima && S.ultima.id === gid ? S.ultima : null);

    clienti: i.clienti || "", ricavi: i.ricavi || "", punto_debole: i.punto_debole || "", primo_passo: i.primo_passo || "",
    tipo_startup: i.tipo_startup || "", fonte_idea: i.fonte_idea || "",

    altro: [i.scalabilita && "Scalabile: " + i.scalabilita, i.replicabilita && "Replicabile: " + i.replicabilita,
      i.startup_innovativa && "Startup innovativa: " + i.startup_innovativa.requisito + " (" + i.startup_innovativa.come + ")",
      i.domande_di_partenza && ["Fra 5-10 anni: " + i.domande_di_partenza.fra_5_10_anni, "Cosa manca: " + i.domande_di_partenza.cosa_manca,
        "Bisogno latente: " + i.domande_di_partenza.bisogno_latente, "Chi lo fa già: " + i.domande_di_partenza.chi_lo_fa_gia].join("\n"),
      i.slide && i.slide.length ? "Bozza slide:\n" + i.slide.map((sl, k) => `${k + 1}. ${sl.titolo}\n` + (sl.punti || []).map((x) => "   - " + x).join("\n")).join("\n") : ""]
      .filter(Boolean).join("\n"),
    compagni: (i.compagni || []).map((c) => c.id),
    // con i nomi: si aggiunge solo se la proposta va alle persone che contiene
    perche: i.perche_noi || "",
    proposta: [
      ...(g.persone || []).filter((id) => profilo(id)).map((id) => ({ id, motivo: ((i.ruoli || []).find((r) => r.id === id) || {}).ruolo || "Scelto da te per lavorare insieme", scelto: true })),
      ...(i.compagni || []).filter((c) => profilo(c.id)).map((c) => ({ id: c.id, motivo: c.motivo || "" })),
    ],
  };
}

// ---------------------------------------------------------------- idea a sezioni
// Un'idea come oggetto a campi. Quelle pubblicate prima si ricavano dal testo
// della descrizione, riga per riga ("Problema: ...").
const ETICHETTE_IDEA = { "problema": "problema", "soluzione": "soluzione", "clienti": "clienti", "ricavi": "ricavi", "cosa cambia": "differenziazione",
  "perché voi": "perche", "perche voi": "perche", "punto debole": "punto_debole", "primo passo": "primo_passo", "tipo di startup": "tipo_startup" };
function strutturaIdea(x) {
  x = x || {};
  if (x.strutturata) return { ...x, criteri: x.criteri ? { ...x.criteri } : null };
  const st = { strutturata: true, titolo: x.titolo || "", modello: x.modello || "", settore: x.settore || "", generata: !!x.generata, generazione: x.generazione,
    sintesi: "", problema: "", soluzione: "", differenziazione: "", clienti: "", ricavi: "", perche: "", punto_debole: "", primo_passo: "",
    tipo_startup: "", fonte_idea: "", altro: "", squadra: "", criteri: null };
  let t = String(x.descrizione || "");
  const k = t.indexOf("La squadra proposta:");
  if (k >= 0) { st.squadra = t.slice(k).trim(); t = t.slice(0, k); }
  const sint = [], altro = [];
  let visto = false;
  for (const riga of t.split("\n")) {
    const m = riga.match(/^([^:]{3,30}):\s*(.*)$/), chiave = m && m[1].trim().toLowerCase();
    if (chiave === "criteri startup") {
      const n = riga.match(/innovazione (\d+).*?scalabilit\S* (\d+).*?replicabilit\S* (\d+).*?sostenibilit\S* (\d+)/i);
      if (n) { st.criteri = { innovazione: +n[1], scalabilita: +n[2], replicabilita: +n[3], sostenibilita: +n[4] }; visto = true; continue; }
    }
    if (chiave && ETICHETTE_IDEA[chiave]) { st[ETICHETTE_IDEA[chiave]] = m[2].trim(); visto = true; continue; }
    if (!visto) sint.push(riga); else if (riga.trim()) altro.push(riga);
  }
  st.sintesi = sint.join("\n").trim(); st.altro = altro.join("\n").trim();
  return st;
}
// Il testo intero dell'idea, rimesso insieme dai campi.
function descrizioneDa(st) {
  const c = st.criteri;
  return [st.sintesi, "",
    st.tipo_startup && "Tipo di startup: " + st.tipo_startup, st.problema && "Problema: " + st.problema, st.soluzione && "Soluzione: " + st.soluzione,
    st.differenziazione && "Cosa cambia: " + st.differenziazione, st.clienti && "Clienti: " + st.clienti, st.ricavi && "Ricavi: " + st.ricavi,
    c && `Criteri startup: innovazione ${c.innovazione}, scalabilità ${c.scalabilita}, replicabilità ${c.replicabilita}, sostenibilità ${c.sostenibilita} (su 10)`,
    st.punto_debole && "Punto debole: " + st.punto_debole, st.primo_passo && "Primo passo: " + st.primo_passo,
    st.altro, st.perche && "\nPerché voi: " + st.perche, st.squadra && "\n" + st.squadra]
    .filter((x) => x || x === "").join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
const SEZIONI_IDEA = [["problema", "Problema"], ["soluzione", "Soluzione"], ["differenziazione", "Cosa cambia"], ["clienti", "Clienti"],
  ["ricavi", "Ricavi"], ["perche", "Perché voi"], ["primo_passo", "Primo passo"], ["altro", "Altro"]];
const CRITERI_IDEA = [["innovazione", "Innovazione"], ["scalabilita", "Scalabilità"], ["replicabilita", "Replicabilità"], ["sostenibilita", "Sostenibilità"]];
// La vista dell'idea. Con ed=true ogni parte ha il pennino; "aperto" e' il
// campo che si sta scrivendo in quel momento.
function vistaIdea(st, ed, aperto, conTitolo) {
  const penna = (c) => ed ? `<button type="button" class="penna" data-penna="${c}" title="Modifica">✎</button>` : "";
  const vuoto = ed ? '<span class="vuoto">aggiungi…</span>' : "";
  const campo = (c, righe) => aperto === c
    ? `<span class="campo-aperto" data-campo-ed="${c}">${righe ? `<textarea data-val rows="${righe}">${esc(st[c] || "")}</textarea>` : `<input type="text" data-val value="${esc(st[c] || "")}">`}<button type="button" class="btn piccolo primario" data-ok-campo>OK</button></span>`
    : `${st[c] ? esc(st[c]) : vuoto}${penna(c)}`;
  const meta = [["tipo_startup", "", "b"], ["fonte_idea", "nata da: "], ["settore", ""]].filter(([c]) => st[c] || ed || aperto === c)
    .map(([c, pre, b]) => aperto === c ? campo(c) : `<span>${st[c] ? (b ? "<b>" : "") + pre + esc(st[c]) + (b ? "</b>" : "") : ed ? `<span class="vuoto">${c === "tipo_startup" ? "tipo di startup" : c === "settore" ? "settore" : "da dove nasce"}</span>` : ""}${penna(c)}</span>`);
  const modello = aperto === "modello"
    ? `<span class="campo-aperto" data-campo-ed="modello"><select data-val>${["", "B2B", "B2C", "B2B2C"].map((m) => `<option ${st.modello === m ? "selected" : ""} value="${m}">${m || "—"}</option>`).join("")}</select><button type="button" class="btn piccolo primario" data-ok-campo>OK</button></span>`
    : (st.modello || ed ? `<span class="etichetta">${esc(st.modello || "modello")}</span>${penna("modello")}` : "");
  const cr = st.criteri;
  const barre = aperto === "criteri"
    ? `<div class="criteri" data-campo-ed="criteri"><div class="criteri-titolo">È una startup? <small>(da 1 a 10)</small></div>${CRITERI_IDEA.map(([k, t]) => `<div class="criterio"><span>${t}</span><input type="range" min="1" max="10" data-crit="${k}" value="${(cr && cr[k]) || 5}"><b data-crit-val="${k}">${(cr && cr[k]) || 5}</b></div>`).join("")}<button type="button" class="btn piccolo primario" data-ok-campo>OK</button></div>`
    : cr ? `<div class="barre-penna">${barreCriteri("È una startup?", CRITERI_IDEA.map(([k, t]) => [t, cr[k]]))}${penna("criteri")}</div>`
    : ed ? `<p class="piccolo"><span class="vuoto">È una startup? Aggiungi la valutazione</span>${penna("criteri")}</p>` : "";
  return `<div class="vista-idea">
    ${conTitolo ? `<h3 class="titolo-vista">${campo("titolo")}</h3>` : ""}
    <div class="piccolo meta-idea">${[...meta, modello].filter(Boolean).join(" · ")}</div>
    <p class="sintesi-vista">${campo("sintesi", 3)}</p>
    ${barre}
    ${st.punto_debole || ed || aperto === "punto_debole" ? `<div class="piccolo"><b>Punto debole:</b> ${campo("punto_debole", 2)}</div>` : ""}
    <dl>${SEZIONI_IDEA.filter(([c]) => st[c] || ed || aperto === c).map(([c, t]) => `<dt>${t}</dt><dd>${campo(c, c === "altro" ? 6 : 3)}</dd>`).join("")}</dl>
  </div>`;
}
// Legge il campo aperto e lo rimette nell'idea.
function chiudiCampo(box, st) {
  const e = box.querySelector("[data-campo-ed]");
  if (!e) return;
  const c = e.dataset.campoEd;
  if (c === "criteri") st.criteri = Object.fromEntries([...e.querySelectorAll("[data-crit]")].map((r) => [r.dataset.crit, Number(r.value)]));
  else st[c] = e.querySelector("[data-val]").value.trim();
}
function barraSelezione() { return ""; }
// Il testo delle idee da pubblicare. Con i nomi solo se la vedono le persone
// della proposta, e solo i loro: chi e' stato tolto non compare e non la vede.
function ideeDaPubblicare(idee, visibilita, proposta, destinatari) {
  const esclusi = proposta.filter((x) => !destinatari.has(x.id)).map((x) => profilo(x.id)).filter(Boolean);
  const parole = esclusi.flatMap((p) => String(p.nome).split(/\s+/).filter((w) => w.length > 2)).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const senzaEsclusi = (t) => !parole.length ? t : t.split(/(?<=[.;!?])\s+/).filter((fr) => !parole.some((w) => new RegExp("(^|[^\\p{L}])" + w + "($|[^\\p{L}])", "iu").test(fr))).join(" ");
  const io = mio();
  const squadra = [...(io ? [`- ${io.nome}: ha proposto l'idea`] : []),
    ...proposta.filter((x) => destinatari.has(x.id) && profilo(x.id)).map((x) => `- ${profilo(x.id).nome}${x.motivo ? ": " + x.motivo : ""}`)];
  return idee.map((i) => {
    const st = strutturaIdea(i);
    if (i.generata && proposta.length) {
      // "Perche' voi" e la squadra solo se la vedono le persone della proposta
      st.perche = visibilita === "scelti" && st.perche ? senzaEsclusi(st.perche) : visibilita === "scelti" ? st.perche : "";
      st.squadra = visibilita === "scelti" && squadra.length ? "La squadra proposta:\n" + squadra.join("\n") : "";
    }
    return { ...st, descrizione: descrizioneDa(st) };
  });
}

// Selezione delle proposte e delle persone, dentro il blocco di ogni generazione.
function aggiornaBlocco(gid) {
  const blocco = document.querySelector(`[data-gen-blocco="${gid}"]`);
  if (!blocco) return;
  const n = blocco.querySelectorAll(".proposta-card.selezionata").length;
  blocco.querySelector("[data-conta-sel]").textContent = n ? `${n} ${n === 1 ? "proposta selezionata" : "proposte selezionate"}` : "Seleziona almeno una proposta";
  blocco.querySelectorAll("[data-condividi-gen]").forEach((b) => { b.disabled = !n; });
}
document.addEventListener("change", (ev) => {
  const c = ev.target.closest("[data-seleziona]");
  if (c) {
    const k = c.dataset.seleziona;
    if (c.checked) {
      if (S.selezione.size >= 5) { c.checked = false; alert("Puoi condividere al massimo 5 idee insieme."); return; }
      S.selezione.add(k);
    } else S.selezione.delete(k);
    c.closest(".proposta-riga").classList.toggle("selezionata", c.checked);
    return aggiornaBlocco(k.split("|")[0]);
  }
  const p = ev.target.closest("[data-persona-gen]");
  if (p) {
    const [gid, id] = p.dataset.personaGen.split("|");
    if (p.checked) toltiDa(gid).delete(id); else toltiDa(gid).add(id);
    p.closest(".persona-gen").classList.toggle("tolta", !p.checked);
  }
});
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-condividi-gen]");
  if (!b) return;
  const [gid, modo] = b.dataset.condividiGen.split("|");
  const g = S.dati.generazioni.find((x) => x.id === gid) || (S.ultima && S.ultima.id === gid ? S.ultima : null);
  if (!g) return;
  const indici = g.idee.map((_, n) => n).filter((n) => S.selezione.has(gid + "|" + n));
  const idee = indici.map((n) => ideaGenerata(gid + "|" + n)).filter(Boolean);
  if (!idee.length) return;
  // Con le persone: quelle spuntate che c'entrano con le idee scelte (il
  // gruppo, o proposte per almeno una di queste idee).
  const tolti = toltiDa(gid);
  const P = modo === "tutti" ? [] : personeGen(g).filter((x) => !x.io && (x.scelto || x.idee.some((n) => indici.includes(n)) || !x.idee.length));
  const proposta = P.map((x) => ({ id: x.id, motivo: x.motivi[0] || x.ruoli[0] || "", scelto: x.scelto }));
  const destinatari = new Set(P.filter((x) => !tolti.has(x.id)).map((x) => x.id));
  const visibilita = modo === "tutti" ? "tutti" : "scelti";
  if (visibilita === "scelti" && !destinatari.size) { alert("Hai tolto la spunta a tutte le persone: spuntane almeno una, oppure condividi con tutti."); return; }
  b.disabled = true;
  try {
    await api("idea", {
      titolo: idee.length === 1 ? idee[0].titolo : "", idee: ideeDaPubblicare(idee.map((i) => visibilita === "tutti" ? { ...i, perche: "" } : i), visibilita, proposta, destinatari),
      visibilita, destinatari: [...destinatari],
      motivi: Object.fromEntries(proposta.filter((x) => destinatari.has(x.id) && x.motivo).map((x) => [x.id, x.motivo])),
      generazione: gid,
    });
    indici.forEach((n) => S.selezione.delete(gid + "|" + n));
    S.dati = await api("dati"); chiudiGenera(); disegna();
    document.getElementById("secBacheca").scrollIntoView({ behavior: "smooth" });
  } catch (e) { b.disabled = false; alert(e.message); }
});
document.addEventListener("click", (ev) => {
  const una = ev.target.closest("[data-condividi-una]");
  if (una) {
    const v = una.dataset.condividiUna, taglio = v.lastIndexOf("|");   // la chiave dell'idea ha gia' un "|"

  if (ev.target.closest("[data-condividi-sel]")) {
    const idee = [...S.selezione].map(ideaGenerata).filter(Boolean);

// ---------------------------------------------------------------- editor

      <div><label>Persone nella squadra, te compreso</label><select id="ePosti">${[8, 7].map((n) => `<option value="${n}" ${Number(post.posti) === n ? "selected" : ""}>${n} persone</option>`).join("")}</select></div></div>
      <div id="msgEd"></div>
      <div class="riga" style="margin-top:14px"><span class="spazio"></span><button class="btn" data-chiudi>Annulla</button>
        <button class="btn primario" id="ePubblica">${post.id ? "Salva" : "Pubblica"}</button></div>
    </div>`;
    if (visibilita === "scelti") pickerPersone(velo.querySelector("#ePick"), destinatari, () => {
      velo.querySelectorAll("[data-dest]").forEach((c) => { c.checked = destinatari.has(c.dataset.dest); });
    }, conProposta ? "Aggiungi qualcun altro: clicca o scrivi un nome…" : "Con chi la condividi? Clicca o scrivi un nome…");
  };
  velo.addEventListener("click", async (ev) => {
    if (ev.target === velo || ev.target.closest("[data-chiudi]")) return chiudi();
    const pn = ev.target.closest("[data-penna]");
    if (pn) {
      const n = Number(pn.closest("[data-blocco]").dataset.blocco), vecchio = aperto;
      leggiBlocchi(); if (vecchio && vecchio.n !== n) blocco(vecchio.n);
      aperto = { n, c: pn.dataset.penna }; blocco(n);
      const el = velo.querySelector(`[data-blocco="${n}"] [data-val], [data-blocco="${n}"] [data-crit]`); if (el) el.focus();
      return;
    }
    if (ev.target.closest("[data-ok-campo]")) { const n = aperto && aperto.n; leggiBlocchi(); if (n !== null) blocco(n); return; }
    if (ev.target.closest("[data-aggiungi-idea]")) { leggiBlocchi(); idee.push(strutturaIdea({})); aperto = { n: idee.length - 1, c: "titolo" }; post.titolo = titoloPost(); disegnaE(); const v = velo.querySelector(`[data-blocco="${idee.length - 1}"] [data-val]`); if (v) v.focus(); return; }
    const togli = ev.target.closest("[data-togli-idea]");
    if (togli) { leggiBlocchi(); idee.splice(Number(togli.dataset.togliIdea), 1); disegnaE(); return; }
    const sd = ev.target.closest("[data-sugg-dest]");
    if (sd) { ev.preventDefault(); leggiBlocchi(); destinatari.add(sd.dataset.suggDest); post.titolo = titoloPost(); disegnaE(); return; }
    if (ev.target.id === "ePubblica") {
      leggiBlocchi();
      if (idee.some((i) => !String(i.titolo || "").trim())) { avvisa(velo.querySelector("#msgEd"), "Ogni idea ha bisogno di un titolo: clicca ✎ accanto al titolo.", "male"); return; }
      const b = ev.target; b.disabled = true;
      try {
        // "Perche' voi" (con i nomi) solo se la vedono le persone della proposta
        const daPubblicare = ideeDaPubblicare(idee, visibilita, proposta, destinatari);
        const motivi = Object.fromEntries(proposta.filter((x) => destinatari.has(x.id) && x.motivo).map((x) => [x.id, x.motivo]));
        await api("idea", {
          id: post.id, titolo: titoloPost(), idee: daPubblicare, visibilita, destinatari: [...destinatari], motivi,
          cerco: velo.querySelector("#eCerco").value, posti: velo.querySelector("#ePosti").value,
          generazione: (idee.find((i) => i.generazione) || {}).generazione,
        });
        chiudi();
        if (post.daSelezione) S.selezione.clear();
        S.dati = await api("dati"); S.scheda = "bacheca"; disegna(); window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (e) { b.disabled = false; avvisa(velo.querySelector("#msgEd"), e.message, "male"); }
    }
  });
  velo.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.matches("input[data-val]")) { ev.preventDefault(); const n = aperto && aperto.n; leggiBlocchi(); if (n !== null) blocco(n); }
  });
  velo.addEventListener("input", (ev) => {
    const r = ev.target.closest("[data-crit]");
    if (r) velo.querySelector(`[data-crit-val="${r.dataset.crit}"]`).textContent = r.value;
  });
  velo.addEventListener("change", (ev) => {
    const d = ev.target.closest("[data-dest]");
    if (d) {
      if (d.checked) destinatari.add(d.dataset.dest); else destinatari.delete(d.dataset.dest);
      leggiBlocchi(); post.titolo = titoloPost();
      post.cerco = velo.querySelector("#eCerco").value; post.posti = velo.querySelector("#ePosti").value;
      disegnaE(); return;
    }
    if (ev.target.name === "vis") {
      leggiBlocchi(); post.titolo = titoloPost();
      post.cerco = velo.querySelector("#eCerco").value; post.posti = velo.querySelector("#ePosti").value;
      visibilita = ev.target.value;
      if (visibilita === "scelti" && !destinatari.size) (post.suggeriti || []).slice(0, 0).forEach((id) => destinatari.add(id));
      disegnaE();
    }
  });
  if (!idee[0].titolo) aperto = { n: 0, c: "titolo" };
  disegnaE();
  const primo = velo.querySelector(idee[0].titolo ? "#eTitolo" : "[data-blocco='0'] [data-val]");
  if (primo) primo.focus();
}

// ---------------------------------------------------------------- PDF di LinkedIn
// pdf.js e' ospitato sul sito (public/vendor/pdfjs) e si carica solo quando
// serve: pesa 1,7 MB e la maggior parte delle visite non lo usa.
let pdfjsPronto = null;
function caricaPdfjs() {
  if (!pdfjsPronto) pdfjsPronto = import("/vendor/pdfjs/pdf.min.mjs").then((m) => {
    m.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs";
    return m;
  });
  return pdfjsPronto;
}
// Legge il PDF che LinkedIn genera da «Altro → Salva come PDF». La pagina ha
// una colonna laterale (contatti, competenze, lingue) e una principale (nome,
// headline, localita', poi le sezioni). Titoli e sezioni si riconoscono dalla
// dimensione del carattere, non dalle parole: cosi' funziona anche con i
// profili in inglese, tedesco o francese.
async function estraiProfiloPdf(pdfjs, dati) {
  const doc = await pdfjs.getDocument({ data: dati }).promise;
  const lato = [], centro = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const pag = await doc.getPage(n);
    const larghezza = pag.getViewport({ scale: 1 }).width;
    const cont = await pag.getTextContent();
    const righe = new Map();
    for (const it of cont.items) {
      if (!it.str || !it.str.trim() || it.height < 10) continue;   // sotto i 10 punti: numeri di pagina
      const x = it.transform[4], y = Math.round(it.transform[5]);
      const col = x < larghezza * 0.3 ? "l" : "c";
      const k = col + ":" + y;
      if (!righe.has(k)) righe.set(k, { col, y, h: 0, pezzi: [] });
      const r = righe.get(k);
      r.pezzi.push({ x, s: it.str });
      r.h = Math.max(r.h, it.height);
    }
    [...righe.values()].sort((a, b) => b.y - a.y).forEach((r) => {
      const t = r.pezzi.sort((a, b) => a.x - b.x).map((p) => p.s).join(" ").replace(/\s+/g, " ").trim();
      (r.col === "l" ? lato : centro).push({ t, h: r.h, pag: n });
    });
  }
  if (!centro.length) throw new Error("il PDF non contiene testo: va salvato da LinkedIn con Altro → Salva come PDF, non stampato");

  // Colonna principale: nome (carattere grande), poi headline e localita',
  // poi sezioni con titolo di corpo medio.
  const hMax = Math.max(...centro.filter((r) => r.pag === 1).map((r) => r.h));
  const eNome = (r) => r.pag === 1 && r.h >= hMax - 1;
  const eTitolo = (r) => !eNome(r) && r.h >= 14.5;
  let i = 0;
  const nome = [];
  while (i < centro.length && eNome(centro[i])) nome.push(centro[i++].t);
  const testa = [];
  while (i < centro.length && !eTitolo(centro[i])) testa.push(centro[i++].t);
  const sezioni = [];
  for (; i < centro.length; i++) {
    if (eTitolo(centro[i])) sezioni.push({ titolo: centro[i].t, righe: [] });
    else if (sezioni.length) sezioni[sezioni.length - 1].righe.push(centro[i].t);
  }
  const sez = (re) => sezioni.filter((s) => re.test(s.titolo)).map((s) => s.righe.join("\n")).join("\n");

  // Colonna laterale: titoli a corpo 13, voci a corpo 11.
  const hLato = lato.length ? Math.max(...lato.map((r) => r.h)) : 0;
  const blocchi = [];
  for (const r of lato) {
    if (r.h >= hLato - 0.5) blocchi.push({ titolo: r.t, righe: [] });
    else if (blocchi.length) blocchi[blocchi.length - 1].righe.push(r.t);
  }
  const competenze = blocchi.filter((b) => /competenze|skills|kenntnisse|comp[ée]tences|aptitudes/i.test(b.titolo))
    .flatMap((b) => b.righe).join(", ");
  const li = /linkedin\.com\/in\/[A-Za-z0-9\-_%]+/i.exec(lato.map((r) => r.t).join("").replace(/\s+/g, ""));

  return {
    nome: nome.join(" ").trim(),
    titolo: testa.slice(0, -1).join(" ").trim() || testa.join(" ").trim(),
    citta: testa.length > 1 ? testa[testa.length - 1] : "",
    linkedin: li ? "https://www." + li[0].replace(/^linkedin/i, "linkedin") + "/" : "",
    competenze,
    riepilogo: sez(/riepilogo|summary|zusammenfassung|r[ée]sum[ée]|resumen|info/i).replace(/\n/g, " "),
    esperienze: sez(/esperienz|experience|berufserfahrung|exp[ée]rience|experiencia/i),
    formazione: sez(/formazione|istruzione|education|ausbildung|formation|educaci[oó]n/i),
    testo: lato.concat(centro).map((r) => r.t).join("\n"),
  };
}

// dal nome Google. Si scrive il nome e il menu completa, come nella mappa del
// vino; frecce e Invio funzionano, poi si conferma.
function collega() {
  const tutti = S.dati.profili;
  $main.innerHTML = `<div class="chi-sei carta">

      <input type="text" id="cercaMe" placeholder="Nome e cognome" autocomplete="off" value="${esc(S.dati.io.nome || "")}">

    </div>
    <div id="conferma"></div>
    <div id="msgCol"></div>
    <details style="margin-top:18px"><summary class="piccolo">Non sono nell'elenco</summary>
      <label>Nome e cognome</label><input type="text" id="nNome" value="${esc(S.dati.io.nome)}">
      <label>Link al tuo profilo LinkedIn</label><input type="text" id="nLi" placeholder="https://www.linkedin.com/in/…">
      <div class="riga" style="margin-top:12px"><button class="btn" id="nCrea">Crea il mio profilo</button></div>
    </details>
  </div>`;
  const inp = document.getElementById("cercaMe"), box = document.getElementById("sugg");
  let trovati = [], sel = 0;
  const scegli = (p) => {
    box.innerHTML = ""; inp.value = p.nome;
    document.getElementById("conferma").innerHTML = `<div class="avviso info riga" style="margin-top:14px">
      <div class="avatar piccolo-av">${esc(iniziali(p.nome))}</div>
      <div style="flex:1;min-width:0"><b>${esc(p.nome)}</b><div class="piccolo">${esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || p.titolo || "")}</div></div>
      <button class="btn primario" data-rivendica="${p.id}">Sì, sono io</button></div>`;
  };
  const mostra = () => {
    document.getElementById("conferma").innerHTML = "";
    const parole = senzaAccenti(inp.value).split(/[\s'’-]+/).filter(Boolean);
    trovati = !parole.length ? [] : tutti.filter((p) => {
      const n = senzaAccenti(p.nome).split(/[\s'’,.-]+/);
      return parole.every((w) => n.some((x) => x.startsWith(w)));
    }).sort((x, y) => Number(!!x.rivendicato) - Number(!!y.rivendicato)).slice(0, 8);
    sel = trovati.findIndex((p) => !p.rivendicato);
    box.innerHTML = trovati.map((p, i) => `<div class="sugg ${i === sel ? "attivo" : ""} ${p.rivendicato ? "preso" : ""}" data-i="${i}">
      <b>${esc(p.nome)}</b> <span class="piccolo">${p.rivendicato ? "già collegato a un altro account" : esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || (p.titolo || "").slice(0, 70))}</span></div>`).join("")
      || (parole.length ? '<div class="sugg preso">Nessun nome così: prova con il cognome, oppure «Non sono nell\'elenco» qui sotto.</div>' : "");
  };
  inp.oninput = mostra;
  inp.onkeydown = (e) => {
    if (!trovati.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const liberi = trovati.map((p, i) => (p.rivendicato ? -1 : i)).filter((i) => i >= 0);
      if (!liberi.length) return;
      const k = liberi.indexOf(sel);
      sel = liberi[(k + (e.key === "ArrowDown" ? 1 : liberi.length - 1)) % liberi.length];
      box.querySelectorAll(".sugg").forEach((el, i) => el.classList.toggle("attivo", i === sel));
    } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); scegli(trovati[sel]); }
  };
  box.onmousedown = (e) => {
    const el = e.target.closest("[data-i]");
    if (!el) return;
    e.preventDefault();
    const p = trovati[Number(el.dataset.i)];
    if (p && !p.rivendicato) scegli(p);
  };
  mostra(); inp.focus(); inp.select();

    try { await api("nuovo-profilo", { nome: document.getElementById("nNome").value, linkedin: document.getElementById("nLi").value }); S.dati = await api("dati"); S.scheda = "profilo"; disegna(); }
    catch (e) { avvisa("msgCol", e.message, "male"); }
  };
}

  const nelSettore = (x, k) => k === "ai" ? eAI(x) : x.i === k;

      ${sel("spPeriodo", [["", "Tutti gli anni"], ["2025", "Dal 2025"], ["2023", "Dal 2023"], ["top", "Le più affermate (Airbnb, Stripe…)"]], F.periodo)}
    </div>
    <p class="piccolo">${aziende.length.toLocaleString("it-IT")} aziende${news.length ? ` e ${news.length} notizie` : ""}${lista.length > F.quanti ? `, ne vedi ${F.quanti}` : ""}</p>
    <div class="griglia">${lista.slice(0, F.quanti).map(({ tipo, x }) => tipo === "yc" ? `<div class="carta spunto">

      <div class="spunto-uno">${esc(x.it || x.o)}</div>
      <div><span class="etichetta fonte-yc">Y Combinator</span>${[SETTORI_YC[x.i] || x.i].filter(Boolean).map((t) => `<span class="etichetta grigia">${esc(t)}</span>`).join("")}${eAI(x) ? '<span class="etichetta">AI</span>' : ""}${x.st === "Acquired" ? '<span class="etichetta ambra">acquisita</span>' : ""}</div>
      <div class="riga piccolo" style="margin-top:auto"><a href="https://www.ycombinator.com/companies/${esc(x.s)}" target="_blank" rel="noopener">Pagina su Y Combinator ↗</a>

        <span class="spazio"></span><button class="btn piccolo primario" data-spunto-tc="${notizie.indexOf(x)}">Usa come spunto</button></div>

// ---------------------------------------------------------------- tutorial

const TOUR = [

  { scheda: "profilo", sel: '[data-tour="linkedin"]', testo: "Per ultimo il tuo <b>profilo</b>: qui i dati di LinkedIn. Controlla che siano giusti; col pennino ✎ cambi ogni campo." },
  { scheda: "profilo", sel: "#passioni", testo: "E qui <b>quello che aggiungi tu</b>: passioni, settori, idee che hai già. Più è completo, più le idee e i compagni che propone l'AI sono giusti." },

let tour = null;
function tourAvvia() {
  if (!S.dati || !S.dati.io.profilo) return;
  tour = { i: 0 };
  if (S.generaAperta) chiudiGenera();
  S.scheda = "bacheca"; disegna(); window.scrollTo(0, 0);
}
function tourFine() {
  tour = null;
  document.querySelectorAll(".tour-anello,.tour-fumetto,.tour-velo").forEach((e) => e.remove());
  memoria("bbs-tutorial-" + S.dati.io.email, "1");
}
function tourMostra() {
  document.querySelectorAll(".tour-anello,.tour-fumetto,.tour-velo").forEach((e) => e.remove());
  if (!tour) return;
  if (document.querySelector(".velo:not(#veloGenera)")) return;   // c'e' una finestra aperta: il tutorial riprende quando si chiude
  const passo = TOUR[tour.i];
  if (!passo) return tourFine();
  // il tutorial apre la scheda di cui parla (bacheca, spunti, profilo)
  const voluta = passo.scheda || "bacheca";
  if (S.scheda !== voluta || S.profiloAltrui) {
    if (S.generaAperta) { S.tourChiude = true; chiudiGenera(); S.tourChiude = false; }
    S.profiloAltrui = null; S.scheda = voluta; disegna(); window.scrollTo(0, 0);   // disegna richiama il tutorial
    return;
  }
  if (passo.apri) { const d = document.querySelector(passo.apri); if (d) d.open = true; }
  // la pagina puo' metterci un attimo (gli spunti si caricano): si riprova
  if (passo.sel && !document.querySelector(passo.sel) && (tour.attese || 0) < 15) { tour.attese = (tour.attese || 0) + 1; return setTimeout(tourMostra, 200); }
  tour.attese = 0;
  // i passi su Genera idee si vedono dentro la sua finestra (o pagina, sul telefono)
  if (passo.genera && !S.generaAperta) { apriGenera(); return setTimeout(tourMostra, 80); }
  if (!passo.genera && S.generaAperta) { S.tourChiude = true; chiudiGenera(); S.tourChiude = false; return setTimeout(tourMostra, 80); }
  // se il punto non si vede (sul telefono le schede stanno nel menu) il fumetto va al centro
  const el0 = passo.sel ? document.querySelector(passo.sel) : null, el = el0 && el0.offsetParent ? el0 : null;
  const fumetto = document.createElement("div");
  fumetto.className = "tour-fumetto";
  const ultimo = tour.i === TOUR.length - 1;
  fumetto.innerHTML = `<div class="piccolo">${tour.i + 1} di ${TOUR.length}</div><div class="tour-testo">${passo.testo}</div>
    <div class="riga" style="margin-top:10px">${ultimo ? "" : '<button class="btn piccolo" data-tour-salta>Salta il tutorial</button>'}<span class="spazio"></span>
    ${passo.azione ? '<span class="piccolo">👆 clicca il punto evidenziato</span>' : `<button class="btn primario piccolo" data-tour-avanti>${ultimo ? "Fine" : tour.i === 0 ? "Iniziamo" : "Avanti"}</button>`}</div>`;
  if (!el) {
    const velo = document.createElement("div"); velo.className = "tour-velo"; document.body.appendChild(velo);
    fumetto.classList.add("al-centro");
    document.body.appendChild(fumetto);
    return;
  }
  el.scrollIntoView({ block: "center" });
  const anello = document.createElement("div"); anello.className = "tour-anello";
  document.body.appendChild(anello); document.body.appendChild(fumetto);
  const posiziona = () => {
    const r = el.getBoundingClientRect(), m = 6;
    Object.assign(anello.style, { top: r.top - m + "px", left: r.left - m + "px", width: r.width + 2 * m + "px", height: r.height + 2 * m + "px" });
    const f = fumetto.getBoundingClientRect();
    const sotto = r.bottom + 14 + f.height < window.innerHeight;
    fumetto.style.top = (sotto ? r.bottom + 14 : Math.max(10, r.top - 14 - f.height)) + "px";
    fumetto.style.left = Math.max(10, Math.min(window.innerWidth - f.width - 10, r.left + r.width / 2 - f.width / 2)) + "px";
    fumetto.classList.toggle("sopra", !sotto);
  };
  posiziona();
  tour.posiziona = posiziona;
  if (passo.azione) el.addEventListener("click", () => { if (tour) { tour.i++; setTimeout(tourMostra, 80); } }, { once: true });
}
document.addEventListener("click", (ev) => {
  if (ev.target.closest("[data-tour-salta]")) tourFine();
  else if (ev.target.closest("[data-tour-avanti]") && tour) { tour.i++; tourMostra(); }
});

// Se nel frattempo e' uscita una versione nuova del sito, un avviso in basso
// propone di ricaricare (cosi' nessuno resta con la pagina vecchia).
async function controllaVersione() {
  if (document.getElementById("avvisoVersione")) return;
  try {
    const t = await (await fetch("/?v=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION) document.body.insertAdjacentHTML("beforeend", `<div id="avvisoVersione" class="avviso-versione">È uscita una nuova versione del sito. <button class="btn piccolo primario" onclick="location.reload()">Aggiorna</button></div>`);
  } catch {}
}
setInterval(controllaVersione, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") controllaVersione(); });

// I problemi di accesso in evidenza: chi e' stato respinto, chi e' entrato
// senza profilo, i collegamenti con un nome Google diverso da quello del
// profilo, chi ha lasciato un profilo, le generazioni fallite.
function controlloAccessi(s) {
  const parole = (t) => new Set(senzaAccenti(String(t || "")).split(/[^a-z]+/).filter((w) => w.length > 2));
  const simili = (a, b) => { const x = parole(a), y = parole(b); return [...x].some((w) => y.has(w)); };
  const ultimoPer = (tipo) => { const m = new Map(); for (const e of s.eventi) if (e.tipo === tipo && !m.has(e.chi)) m.set(e.chi, e); return [...m.values()]; };
  const entrati = new Set(s.utenti.map((u) => u.email));
  const respinti = ultimoPer("rifiutato").filter((e) => !entrati.has(e.chi));
  const senza = s.utenti.filter((u) => !u.profiloNome);
  const strani = s.utenti.filter((u) => u.profiloNome && u.nome && !simili(u.nome, u.profiloNome));
  const lasciati = ultimoPer("lascia");
  const errori = s.eventi.filter((e) => e.tipo === "errore-generazione").slice(0, 10);
  const blocco = (titolo, spiega, righe) => `<div class="carta"><h3 style="margin-top:0">${titolo} <span class="etichetta ${righe.length ? "ambra" : "verde"}">${righe.length}</span></h3>
    <p class="piccolo" style="margin-top:0">${spiega}</p>${righe.length ? `<ul class="piccolo" style="margin:0;padding-left:18px">${righe.join("")}</ul>` : '<p class="piccolo" style="margin:0">Nessun problema.</p>'}</div>`;
  return `<h3 style="margin-top:8px">Dashboard alert</h3>
    <div class="due">
      ${blocco("Respinti all'ingresso", "Hanno provato a entrare con un account Google non in elenco: probabilmente un indirizzo diverso da quello dato alla BBS.",
        respinti.map((e) => `<li><b>${esc(e.chi)}</b> · ${quando(e.quando)}</li>`))}
      ${blocco("Entrati senza profilo", "Sono dentro ma non collegati a un profilo del master: devono sceglierlo con «Chi sei?».",
        senza.map((u) => `<li><b>${esc(u.nome || "")}</b> ${esc(u.email)} · ${quando(u.ultimo)}</li>`))}
      ${blocco("Collegamenti da controllare", "Il nome dell'account Google non somiglia a quello del profilo collegato.",
        strani.map((u) => `<li><b>${esc(u.nome)}</b> (${esc(u.email)}) → ${esc(u.profiloNome)}</li>`))}
      ${blocco("Hanno lasciato un profilo", "Hanno premuto «Questo non è il mio profilo».",
        lasciati.map((e) => `<li><b>${esc(e.chi)}</b> ha lasciato ${esc(e.nome || "?")} · ${quando(e.quando)}</li>`))}
      ${blocco("Generazioni fallite", "Gli errori dell'AI (le ultime 10). Le connessioni cadute dal telefono non compaiono qui: la pagina recupera le idee da sola.",
        errori.map((e) => `<li><b>${esc(e.chi)}</b> · ${quando(e.quando)} · ${esc(e.errore || "")}</li>`))}
    </div>`;
}
// Le statistiche, in fondo alla Regia.

  };

        ${barre(s.cercati, (c) => esc(c.nome))}</div>

      ${s.utenti.map((u) => `<tr><td>${esc(u.email)}</td><td>${esc(u.profiloNome || "—")}</td><td>${u.accessi || 0}</td><td>${quando(u.ultimo)}</td>

        <td><button class="btn piccolo" data-crediti="${esc(u.email)}">+5 crediti</button></td></tr>`).join("")}
    </table></div>
    <h3 style="margin-top:24px">Registro</h3>

      ${s.eventi.map((e) => { const { quando: q, chi, tipo, ...r } = e; return `<tr><td>${quando(q)}</td><td>${esc(chi)}</td><td>${esc(tipo)}</td><td class="piccolo">${esc(Object.entries(r).map(([k, v]) => k + ": " + (Array.isArray(v) ? v.join(", ") : typeof v === "object" && v ? JSON.stringify(v) : v)).join(" · ")).slice(0, 300)}</td></tr>`; }).join("")}
    </table></div>`;
}

    ["Come vorrebbe il progetto", (p) => (p.extra || {}).cosaCerco], ["Idee sue", (p) => (p.extra || {}).ideeMie],
    ["Non vuole", (p) => (p.extra || {}).nonVoglio], ["Disponibilità", (p) => (p.extra || {}).disponibilita],
    ["AIDA settore", (p) => p.aziendaInfo && (p.aziendaInfo.settore || p.aziendaInfo.ateco)],
    ["AIDA fatturato", (p) => p.aziendaInfo && p.aziendaInfo.fatturato], ["AIDA dipendenti", (p) => p.aziendaInfo && p.aziendaInfo.dipendenti],
    ["Collegato", (p) => (p.rivendicato ? "sì" : "no")], ["Aggiornato", (p) => p.aggiornato],
  ];
  const cella = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const righe = [col.map((c) => cella(c[0])).join(";")]
    .concat(S.dati.profili.map((p) => col.map((c) => cella(c[1](p))).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + righe.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "profili-bbs-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
}

// ---------------------------------------------------------------- importa (admin)
function leggiCsv(testo) {
  testo = testo.replace(/^﻿/, "");
  const prima = testo.split(/\r?\n/)[0] || "";
  const sep = [";", "\t", ","].sort((a, b) => prima.split(b).length - prima.split(a).length)[0];
  const righe = []; let riga = [], campo = "", virgolette = false;
  for (let i = 0; i < testo.length; i++) {
    const c = testo[i];
    if (virgolette) {
      if (c === '"' && testo[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') virgolette = false;
      else campo += c;
    } else if (c === '"') virgolette = true;
    else if (c === sep) { riga.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && testo[i + 1] === "\n") i++; riga.push(campo); righe.push(riga); riga = []; campo = ""; }
    else campo += c;
  }
  if (campo || riga.length) { riga.push(campo); righe.push(riga); }
  const testa = (righe.shift() || []).map((h) => h.trim());
  return righe.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(testa.map((h, i) => [h, (r[i] || "").trim()])));
}
// Nome colonna -> campo nostro, per regole (le esportazioni hanno intestazioni diverse).
function mappa(riga, regole) {
  const out = {}, altro = {};
  for (const [h, v] of Object.entries(riga)) {
    const k = h.toLowerCase();
    const r = regole.find(([re]) => re.test(k));
    if (r && !out[r[1]]) out[r[1]] = v; else if (v) altro[h] = v;
  }
  return [out, altro];
}

  [/location|citt|city/, "citta"], [/experience|esperienz|summary|about|riepilogo|informazioni/, "esperienze"],
