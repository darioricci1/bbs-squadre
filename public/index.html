<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Squadre BBS</title>
<link rel="icon" type="image/png" href="/logo-bbs.png">
<meta name="robots" content="noindex">
<!--
  public/index.html
  Piattaforma per formare i gruppi del project work del master BBS e
  generare idee di startup a partire dai profili delle persone.
  La versione sta in const VERSION qui sotto.
-->
<style>
  :root{
    --sfondo:#f5f6f8; --carta:#fff; --bordo:#e3e6ea; --testo:#17202a; --grigio:#667079;
    --accento:#1f5eff; --accento-chiaro:#e8efff; --verde:#1d8a4e; --verde-chiaro:#e5f5ec;
    --ambra:#a86400; --ambra-chiaro:#fff4e0; --rosso:#c5221f; --rosso-chiaro:#fdecea;
    --ombra:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.15);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sfondo:#0f1318; --carta:#171c22; --bordo:#2a313a; --testo:#e7ebef; --grigio:#9aa4ae;
      --accento:#6d95ff; --accento-chiaro:#1c2740; --verde:#4cc684; --verde-chiaro:#15291f;
      --ambra:#f0b050; --ambra-chiaro:#2b2212; --rosso:#ff7b72; --rosso-chiaro:#2e1716;
      --ombra:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sfondo);color:var(--testo);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accento)}
  header{position:sticky;top:0;z-index:5;background:var(--carta);border-bottom:1px solid var(--bordo)}
  .barra{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .marchio{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px}
  .marchio img{width:32px;height:32px;display:block}
  @media (max-width:760px){.marchio small{display:none}}
  .marchio small{color:var(--grigio);font-weight:500;font-size:12px;margin-left:6px}
  nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
  nav button{background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--grigio);font:inherit;cursor:pointer}
  nav button.attivo{background:var(--accento-chiaro);color:var(--accento);font-weight:600}
  .chi{font-size:13px;color:var(--grigio);display:flex;gap:8px;align-items:center}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
  .sotto{color:var(--grigio);margin:0 0 18px}
  .carta{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:16px;box-shadow:var(--ombra)}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .riga{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spazio{flex:1}
  input[type=text],input[type=search],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bordo);border-radius:9px;
    background:var(--carta);color:var(--testo);font:inherit}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  label small{font-weight:400;color:var(--grigio)}
  .btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);padding:8px 13px;border-radius:9px;font:inherit;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accento)}
  .btn.primario{background:var(--accento);border-color:var(--accento);color:#fff;font-weight:600}
  .btn.piccolo{padding:4px 9px;font-size:13px}
  .btn.pericolo{color:var(--rosso)}
  .btn:disabled{opacity:.5;cursor:default}
  .etichetta{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accento-chiaro);color:var(--accento);margin:2px 4px 2px 0}
  .etichetta.verde{background:var(--verde-chiaro);color:var(--verde)}
  .etichetta.ambra{background:var(--ambra-chiaro);color:var(--ambra)}
  .etichetta.grigia{background:var(--sfondo);color:var(--grigio);border:1px solid var(--bordo)}
  .persona{display:flex;flex-direction:column;gap:6px;position:relative}
  .persona.scelta{outline:2px solid var(--accento)}
  .persona .testa{display:flex;gap:10px;align-items:center}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--accento-chiaro);color:var(--accento);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .nome{font-weight:650}
  .piccolo{font-size:13px;color:var(--grigio)}
  .az{font-size:12.5px;background:var(--sfondo);border-radius:8px;padding:6px 8px;color:var(--grigio)}
  .idea h3{margin:0 0 6px;font-size:17px}
  .idea dl{margin:8px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
  .idea dt{color:var(--grigio)}
  .idea dd{margin:0}
  .avviso{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
  .avviso.male{background:var(--rosso-chiaro);color:var(--rosso)}
  .avviso.bene{background:var(--verde-chiaro);color:var(--verde)}
  .avviso.info{background:var(--accento-chiaro);color:var(--accento)}
  .porta{max-width:440px;margin:60px auto;text-align:center}
  #pulsante{display:flex;justify-content:center;min-height:44px;margin:18px 0}
  .lista-persone{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;overflow:hidden;box-shadow:var(--ombra)}
  .riga-persona{border-bottom:1px solid var(--bordo);cursor:pointer}
  .riga-persona:last-child{border-bottom:0}
  .riga-persona:hover{background:var(--sfondo)}
  .riga-persona.scelta{box-shadow:inset 3px 0 0 var(--accento)}
  .rp-testa{display:flex;align-items:center;gap:12px;padding:9px 14px}
  .piccolo-av{width:34px;height:34px;font-size:13px}
  .rp-nome{flex:1;min-width:0}
  .rp-lavoro{font-size:13px;color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-trovato{font-size:12.5px;color:var(--grigio);margin-top:2px}
  .rp-trovato mark{background:var(--ambra-chiaro);color:var(--testo);padding:0 2px;border-radius:3px}
  .rp-etichette{flex:none;max-width:34%;text-align:right}
  .rp-azioni{flex:none;display:flex;align-items:center;gap:10px}
  .rp-freccia{color:var(--grigio);width:12px}
  .rp-dettagli{margin:0;padding:4px 14px 14px 60px;display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px;cursor:default}
  .rp-dettagli dt{color:var(--grigio)}
  .rp-dettagli dd{margin:0;white-space:pre-line}
  @media (max-width:760px){.rp-etichette{display:none}.rp-dettagli{padding-left:14px;grid-template-columns:1fr}.rp-dettagli dt{margin-top:6px}}
  .chi-sei{max-width:560px;margin:30px auto}
  .completa{position:relative}
  .completa input{font-size:17px;padding:12px 14px}
  .suggerimenti{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--carta);border:1px solid var(--bordo);border-top:0;border-radius:0 0 10px 10px;box-shadow:var(--ombra);overflow:hidden}
  .suggerimenti:empty{display:none}
  .sugg{padding:9px 14px;cursor:pointer;border-top:1px solid var(--bordo)}
  .sugg.attivo{background:var(--accento-chiaro)}
  .sugg.preso{color:var(--grigio);cursor:default}
  .solo-largo{}
  @media (max-width:760px){.solo-largo{display:none}}
  .sezione-genera{margin-top:40px;padding-top:28px;border-top:2px dashed var(--bordo)}
  .motore{position:relative;padding-top:20px}
  .motore h3{margin:0 0 4px}
  .motore-n{position:absolute;top:-14px;left:16px;width:28px;height:28px;border-radius:50%;background:var(--accento);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--bordo);border-radius:10px;padding:6px;background:var(--carta)}
  .picker-campo{flex:1;min-width:160px}
  .picker-campo input{border:0;padding:6px;font-size:15px}
  .picker-campo input:focus{outline:none}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--accento-chiaro);color:var(--accento);border-radius:99px;padding:3px 4px 3px 10px;font-size:13.5px}
  .chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
  .spunta{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:6px 16px 0 0;cursor:pointer}
  .idea.selezionata{outline:2px solid var(--accento)}
  .idea.riservata{border-color:var(--ambra)}
  .riservata-nota{font-size:12.5px;color:var(--ambra);background:var(--ambra-chiaro);border-radius:8px;padding:4px 8px;margin-top:8px}
  .descr{white-space:pre-wrap}
  .sotto-idea{border-top:1px solid var(--bordo);padding:6px 0}
  .sotto-idea summary{cursor:pointer}
  .velo{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px}
  .finestra{background:var(--carta);color:var(--testo);border-radius:16px;padding:20px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .blocco-idea{border:1px solid var(--bordo);border-radius:12px;padding:12px;margin-top:12px}
  body.bloccato{overflow:hidden}
  .regia-gen{margin-bottom:12px}
  .regia-gen table td,.regia-gen table th{padding:5px 8px}
  .tour-velo{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.55)}
  .tour-anello{position:fixed;z-index:30;border-radius:12px;box-shadow:0 0 0 3px var(--accento),0 0 0 9999px rgba(10,15,25,.55);pointer-events:none;transition:all .2s}
  .tour-fumetto{position:fixed;z-index:31;width:min(340px,calc(100vw - 20px));background:var(--carta);color:var(--testo);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .tour-fumetto::before{content:"";position:absolute;top:-8px;left:calc(50% - 8px);border:8px solid transparent;border-top:0;border-bottom-color:var(--carta)}
  .tour-fumetto.sopra::before{top:auto;bottom:-8px;border-bottom:0;border-top:8px solid var(--carta)}
  .tour-fumetto.al-centro{top:50%;left:50%;transform:translate(-50%,-50%)}
  .tour-fumetto.al-centro::before{display:none}
  .tour-testo{margin-top:4px;line-height:1.45}
  .picker-scatola{position:relative}
  .picker-chip{display:contents}
  .picker-freccia{border:0;background:none;color:var(--grigio);cursor:pointer;font-size:16px;padding:0 6px}
  .elenco-persone{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--carta);border:1px solid var(--bordo);border-radius:10px;box-shadow:var(--ombra);max-height:300px;overflow-y:auto}
  .elenco-testa{position:sticky;top:0;background:var(--carta);display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bordo)}
  .voce-persona{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--bordo);font-weight:400;margin:0}
  .voce-persona:last-child{border-bottom:0}
  .voce-persona.attivo,.voce-persona:hover{background:var(--accento-chiaro)}
  .voce-persona input{margin-top:3px;flex:none}
  .criteri{margin:8px 0;display:grid;gap:3px}
  .criterio{display:grid;grid-template-columns:170px 1fr 24px;align-items:center;gap:8px;font-size:12.5px;color:var(--grigio)}
  .criterio .livello{display:block;height:6px;border-radius:3px;background:var(--accento-chiaro);overflow:hidden}
  .criterio .livello span{display:block;height:6px;background:var(--accento)}
  .criterio b{color:var(--testo);text-align:right}
  .criteri-titolo{font-size:12px;font-weight:600;color:var(--testo);margin-top:2px}
  .criterio.debole .livello span{background:var(--ambra)}
  .domande{margin-top:8px;border-top:1px solid var(--bordo);padding-top:6px}
  .domande summary{cursor:pointer;font-weight:600;font-size:14px}
  .slide-bozza{margin-top:10px;border-top:1px solid var(--bordo);padding-top:8px}
  .slide-bozza summary{cursor:pointer;font-weight:600;font-size:14px}
  .slide{border:1px solid var(--bordo);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--sfondo)}
  .slide ul{margin:6px 0 0;padding-left:18px}
  .filtri-spunti{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
  @media (max-width:760px){.filtri-spunti,.filtri-spunti.due{grid-template-columns:1fr}.criterio{grid-template-columns:110px 1fr 24px}}
  .spunto{display:flex;flex-direction:column;gap:6px}
  .spunto-uno{font-weight:600}
  .lavoro{border-top:1px solid var(--bordo);padding:12px 0}
  .lavoro:first-of-type{border-top:0}
  .lavoro .due{gap:10px}
  .lavoro textarea{min-height:64px}
  .stato-az{font-size:12px;padding:2px 8px;border-radius:99px}
  .stato-az.mancante{background:#fde8e8;color:#b42318}
  .stato-az.dubbio{background:var(--ambra-chiaro);color:var(--ambra)}
  .stato-az.trovata,.stato-az.verificata{background:var(--verde-chiaro);color:var(--verde)}
  .stato-az.ignorata{background:var(--sfondo);color:var(--grigio);border:1px solid var(--bordo)}
  .persona-lavoro{margin:6px 0 0;padding-left:10px;border-left:3px solid var(--bordo)}
  .approfondisci{margin-top:10px;width:100%}
  .proposta-persone{border:1px solid var(--bordo);border-radius:10px;padding:8px 12px;margin:6px 0 10px;max-height:320px;overflow:auto}
  .voce-proposta{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--bordo)}
  .voce-proposta:first-child{border-top:0}
  .voce-proposta input{margin-top:4px}
  .scelte-gen{margin-top:12px}
  .gettoni{display:flex;flex-wrap:wrap;gap:6px}
  .gettone{border:1px solid var(--bordo);background:var(--carta,#fff);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:inherit}
  .gettone:hover{border-color:var(--accento)}
  .gettone.attivo{background:var(--accento);border-color:var(--accento);color:#fff}
  .perche-te{background:var(--accento-chiaro);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
  .motore h3{font-size:18px}
  .percorsi{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px;margin:22px 0 12px}
  @media (max-width:760px){.percorsi{grid-template-columns:1fr}}
  .percorso{position:relative;text-align:left;background:var(--carta,#fff);border:2px solid var(--bordo);border-radius:14px;padding:22px 16px 14px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
  .percorso:hover{border-color:var(--accento)}
  .percorso.scelto{border-color:var(--accento);background:var(--accento-chiaro)}
  .fonti{display:inline-flex;border:1px solid var(--bordo);border-radius:99px;padding:3px;margin:0 0 12px;background:var(--sfondo)}
  .fonti button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;color:var(--grigio)}
  .fonti button.attiva{background:var(--accento);color:#fff}
  .filtri-spunti.due{grid-template-columns:2fr 1fr}
  .articoli{display:flex;flex-direction:column;gap:10px}
  .articolo .sintesi{color:var(--grigio);font-size:14px}
  textarea.evidenzia{outline:3px solid var(--accento);transition:outline .3s}
  .scelti{position:sticky;bottom:12px;margin-top:16px}
  .num{font-size:28px;font-weight:700;letter-spacing:-.02em}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bordo);vertical-align:top}
  th{color:var(--grigio);font-weight:600}
  .scorri{overflow-x:auto}
  details summary{cursor:pointer}
  .caricamento{color:var(--grigio);padding:30px;text-align:center}
  .due{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.due{grid-template-columns:1fr}.idea dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="barra">
  <div class="marchio"><img src="/logo-bbs.png" alt="Bologna Business School">Squadre BBS <small>project work</small></div>
  <nav id="nav"></nav>
  <div class="chi" id="chi"></div>
</div></header>
<main id="main"><div class="caricamento">Caricamento…</div></main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
const VERSION = "2.8.0";
const $main = document.getElementById("main");
const S = { opz: { modello: "", perno: "", settori: [], tipo: "", fonte: "" }, aperti: new Set(), dati: null, scheda: "bacheca", scelti: new Set(), selezione: new Set(), filtro: "", ultima: null,
  stat: null, generando: false, comeUtente: memoria("bbs-come-utente") === "1" };

// ---------------------------------------------------------------- utilita'
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iniziali = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0].toUpperCase()).join("");
const quando = (t) => t ? new Date(t).toLocaleString("it-IT", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

async function api(azione, corpo, url) {
  const headers = S.comeUtente ? { "x-bbs-come-utente": "1" } : {};
  const r = await fetch(url || ("/api/bbs?a=" + azione), corpo === undefined ? { headers } : {
    method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || ("HTTP " + r.status)); e.stato = r.status; throw e; }
  return j;
}
function avvisa(dove, testo, tipo) {
  const el = typeof dove === "string" ? document.getElementById(dove) : dove;
  if (el) el.innerHTML = testo ? `<div class="avviso ${tipo || "info"}">${esc(testo)}</div>` : "";
}
const profilo = (id) => S.dati.profili.find((p) => p.id === id);
const mio = () => S.dati.io.profilo && profilo(S.dati.io.profilo);

// ---------------------------------------------------------------- avvio
async function carica() {
  try {
    S.dati = await api("dati");
    if (location.hash === "#importa" && S.dati.io.admin) S.scheda = "importa";
    disegna();
  } catch (e) {
    if (e.stato === 401) return porta();
    $main.innerHTML = `<div class="avviso male">${esc(e.message)}</div>`;
  }
}

function porta() {
  document.getElementById("nav").innerHTML = "";
  document.getElementById("chi").innerHTML = "";
  $main.innerHTML = `<div class="porta carta">
    <img src="/logo-bbs.png" alt="Bologna Business School" style="width:84px;height:84px;display:block;margin:0 auto 10px">
    <h2>Squadre BBS</h2>
    <p class="sotto">Trova con chi fare il project work e genera idee di startup a partire dai profili del master.</p>
    <div id="pulsante"></div><div id="msgPorta"></div>
    <p class="piccolo" style="text-align:left">Entri con Google. Vedrai i profili dei compagni di corso e potrai completare il tuo. Le attività sulla piattaforma (profili, idee generate, bacheca) sono registrate e visibili a Dario, che la gestisce, anche in forma di statistiche aggregate.</p>
  </div>`;
  api("config").then((c) => {
    if (!c.clientId) return avvisa("msgPorta", "Manca GOOGLE_CLIENT_ID fra le variabili d'ambiente su Vercel.", "male");
    const t = setInterval(() => {
      if (!(window.google && google.accounts && google.accounts.id)) return;
      clearInterval(t);
      google.accounts.id.initialize({ client_id: c.clientId, callback: (r) => {
        avvisa("msgPorta", "Un momento…");
        api("entra", { credential: r.credential }).then(carica).catch((e) => avvisa("msgPorta", e.message, "male"));
      } });
      google.accounts.id.renderButton(document.getElementById("pulsante"), { theme: "outline", size: "large", text: "signin_with", locale: "it", width: 300 });
    }, 120);
  }).catch((e) => avvisa("msgPorta", e.message, "male"));
}

// ---------------------------------------------------------------- struttura
// Chi usa la piattaforma vede due schede: la Bacheca (la home, con sotto i
// due motori che generano le idee) e il proprio profilo. L'amministratore ha
// in piu' Regia e Statistiche; Importa si apre da /#importa.
const SCHEDE = [["bacheca", "Bacheca"], ["spunti", "Spunti"], ["profilo", "Il mio profilo"]];
const SCHEDE_ADMIN = [["regia", "Regia"], ["aziende", "Aziende"], ["statistiche", "Statistiche"]];
const SOLO_ADMIN = ["regia", "aziende", "statistiche", "importa"];

function disegna() {
  const d = S.dati;
  if (!d.io.admin && SOLO_ADMIN.includes(S.scheda)) S.scheda = "bacheca";
  if (!d.io.profilo && !(d.io.admin && SOLO_ADMIN.includes(S.scheda))) S.scheda = "profilo";
  const schede = SCHEDE.concat(d.io.admin ? SCHEDE_ADMIN : []);
  const attiva = (k) => S.scheda === k || (k === "bacheca" && ["genera", "persone"].includes(S.scheda));
  document.getElementById("nav").innerHTML = schede.map(([k, t]) =>
    `<button data-scheda="${k}" class="${attiva(k) ? "attivo" : ""}">${t}</button>`).join("");
  document.getElementById("chi").innerHTML = `
    ${d.io.adminVero ? `<button class="btn piccolo" id="modoUtente" title="Usa la piattaforma come un collega qualsiasi">${d.io.admin ? "Vedi come utente" : "Torna amministratore"}</button>` : ""}
    <button class="btn piccolo" id="aiuto" title="Rivedi il tutorial">?</button>
    <span class="solo-largo">${esc(d.io.email)}</span><button class="btn piccolo" id="esci">Esci</button>`;
  const viste = { bacheca: () => home(false), genera: () => home(true), persone, spunti, profilo: schedaProfilo, regia, aziende, statistiche, importa };
  (viste[S.scheda] || viste.bacheca)();
  if (S.comeUtente) $main.insertAdjacentHTML("afterbegin", `<div class="avviso info riga" style="margin-top:0">
    <span>Stai usando la piattaforma <b>come un utente qualsiasi</b>: niente Regia, bacheca e crediti come li vedono i colleghi.</span>
    <span class="spazio"></span><button class="btn piccolo" data-torna-admin>Torna amministratore</button></div>`);
  if (tour) setTimeout(tourMostra, 30);
  else tourSePrimaVolta();
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-scheda]");
  if (b) { ev.preventDefault(); S.scheda = b.dataset.scheda; disegna(); if (S.scheda !== "genera") window.scrollTo(0, 0); }
  if (ev.target.id === "esci") api("esci", {}).then(porta);
  if (ev.target.id === "aiuto") tourAvvia();
  if (ev.target.id === "modoUtente" || ev.target.closest("[data-torna-admin]")) {
    S.comeUtente = !S.comeUtente;
    memoria("bbs-come-utente", S.comeUtente ? "1" : "");
    S.dati = await api("dati"); S.scheda = "bacheca"; disegna(); window.scrollTo(0, 0);
  }
});
function memoria(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); }
  catch { return null; }
}

// La home: in alto la bacheca, sotto i motori delle idee.
function home(vaiAGenera) {
  $main.innerHTML = `<section id="secBacheca"></section><section id="secGenera" class="sezione-genera"></section>`;
  bacheca(); genera();
  if (vaiAGenera) document.getElementById("secGenera").scrollIntoView({ behavior: "smooth" });
}
function sezione(id) {
  if (!document.getElementById(id)) home(false);
  return document.getElementById(id);
}

// Scelta di persone: cliccando si apre l'elenco di tutti in ordine
// alfabetico, con una casella da spuntare per ciascuno (se ne scelgono quante
// si vuole, l'elenco resta aperto). Scrivendo l'elenco si restringe; quando
// resta una sola persona, Invio la spunta. Serve per il gruppo del motore 1 e
// per decidere con chi condividere un'idea.
function pickerPersone(box, scelti, alCambio, segnaposto, massimo) {
  const io = S.dati.io.profilo;
  const tutti = S.dati.profili.filter((p) => p.id !== io)
    .sort((x, y) => String(x.nome).localeCompare(String(y.nome), "it", { sensitivity: "base" }));
  let trovati = [], sel = 0, aperto = false;
  box.innerHTML = `<div class="picker-scatola">
    <div class="picker"><span class="picker-chip"></span>
      <div class="picker-campo"><input type="text" data-tour="pick" placeholder="${esc(segnaposto || "Clicca per scegliere, o scrivi un nome…")}" autocomplete="off"></div>
      <button type="button" class="picker-freccia" aria-label="Apri l'elenco">▾</button></div>
    <div class="elenco-persone" hidden></div></div>`;
  const inp = box.querySelector("input"), elenco = box.querySelector(".elenco-persone"), chip = box.querySelector(".picker-chip");
  const cambiato = () => { disegnaChip(); if (aperto) disegnaElenco(); alCambio && alCambio(); };
  const disegnaChip = () => {
    chip.innerHTML = [...scelti].map((id) => `<span class="chip">${esc((profilo(id) || {}).nome || "?")}<button type="button" data-via="${id}" aria-label="Togli">×</button></span>`).join("");
    chip.querySelectorAll("[data-via]").forEach((b) => { b.onclick = (e) => { e.stopPropagation(); scelti.delete(b.dataset.via); cambiato(); }; });
  };
  const disegnaElenco = () => {
    const parole = senzaAccenti(inp.value).split(/[\s'’-]+/).filter(Boolean);
    trovati = tutti.filter((p) => parole.every((w) => senzaAccenti(p.nome).split(/[\s'’,.-]+/).some((x) => x.startsWith(w))));
    if (sel >= trovati.length) sel = Math.max(0, trovati.length - 1);
    elenco.innerHTML = `<div class="elenco-testa piccolo">${trovati.length === tutti.length ? tutti.length + " persone" : trovati.length + " su " + tutti.length}${scelti.size ? " · " + scelti.size + " scelte" : ""}
        <span class="spazio"></span><button type="button" class="btn piccolo" data-fatto>Fatto</button></div>` +
      (massimo && scelti.size >= massimo ? `<div class="voce-persona piccolo">Hai già scelto ${massimo} persone, il massimo: per aggiungerne una, togline un'altra.</div>` : "") +
      (trovati.map((p, i) => `<label class="voce-persona ${i === sel ? "attivo" : ""}" data-i="${i}">
        <input type="checkbox" ${scelti.has(p.id) ? "checked" : ""} ${massimo && scelti.size >= massimo && !scelti.has(p.id) ? "disabled" : ""}>
        <span><b>${esc(p.nome)}</b> <span class="piccolo">${esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || (p.titolo || "").slice(0, 60))}</span></span></label>`).join("")
       || '<div class="voce-persona piccolo">Nessun nome così.</div>');
    elenco.querySelectorAll(".voce-persona[data-i]").forEach((el) => {
      el.querySelector("input").onchange = (e) => {
        const p = trovati[Number(el.dataset.i)];
        if (e.target.checked) scelti.add(p.id); else scelti.delete(p.id);
        sel = Number(el.dataset.i);
        cambiato(); inp.focus();
      };
    });
    const fatto = elenco.querySelector("[data-fatto]");
    if (fatto) fatto.onclick = () => chiudi();
    const att = elenco.querySelector(".voce-persona.attivo");
    if (att) att.scrollIntoView({ block: "nearest" });
  };
  const apri = () => { if (aperto) return; aperto = true; elenco.hidden = false; disegnaElenco(); };
  const chiudi = () => { aperto = false; elenco.hidden = true; inp.value = ""; };
  const spunta = (p) => { if (scelti.has(p.id)) scelti.delete(p.id); else if (!massimo || scelti.size < massimo) scelti.add(p.id); cambiato(); };
  inp.onfocus = apri;
  inp.onclick = apri;
  box.querySelector(".picker-freccia").onclick = () => { if (aperto) chiudi(); else { apri(); inp.focus(); } };
  inp.oninput = () => { sel = 0; apri(); disegnaElenco(); };
  inp.onkeydown = (e) => {
    if (e.key === "Escape") { chiudi(); inp.blur(); return; }
    if (e.key === "Backspace" && !inp.value && scelti.size) { scelti.delete([...scelti].pop()); cambiato(); return; }
    if (!aperto) apri();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!trovati.length) return;
      sel = (sel + (e.key === "ArrowDown" ? 1 : trovati.length - 1)) % trovati.length;
      disegnaElenco();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!trovati.length) return;
      spunta(trovati[trovati.length === 1 ? 0 : sel]);
      if (trovati.length === 1) { inp.value = ""; sel = 0; disegnaElenco(); }
    }
  };
  // clic fuori: si chiude
  const fuori = (e) => { if (!box.isConnected) return document.removeEventListener("mousedown", fuori); if (aperto && !box.contains(e.target)) chiudi(); };
  document.addEventListener("mousedown", fuori);
  disegnaChip();
}

// Una persona per riga: nome, lavoro e i pulsanti sempre visibili; il resto
// si apre cliccando sulla riga. Quando si cerca, sotto il nome compare il
// pezzo di profilo che ha fatto trovare la persona.
function rigaPersona(p) {
  const x = p.extra || {}, az = p.aziendaInfo;

  const lavoro = [p.ruolo, p.azienda].filter(Boolean).join(" · ") || p.titolo || "";

    (x.settori || "").split(/[,;]/).filter((t) => t.trim()).slice(0, 2).map((t) => `<span class="etichetta grigia">${esc(t.trim())}</span>`).join("") +
    (!p.rivendicato ? '<span class="etichetta grigia">non ancora entrato</span>' : "");

    <div class="rp-testa">
      <div class="avatar piccolo-av">${p.foto ? `<img src="${esc(p.foto)}" alt="" referrerpolicy="no-referrer">` : esc(iniziali(p.nome))}</div>
      <div class="rp-nome"><div><b>${esc(p.nome)}</b> ${sonoIo ? '<span class="etichetta verde">tu</span>' : ""}</div>
        <div class="rp-lavoro">${esc(lavoro)}</div>
        ${trovato ? `<div class="rp-trovato">…${trovato}…</div>` : ""}</div>
      <div class="rp-etichette">${etichette}</div>
      <div class="rp-azioni">
        ${p.linkedin ? `<a class="piccolo" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
        ${!sonoIo ? `<button class="btn piccolo ${scelto ? "primario" : ""}" data-scegli="${p.id}">${scelto ? "Nel gruppo ✓" : "+ Gruppo"}</button>` : ""}
        <span class="rp-freccia">${aperta ? "▴" : "▾"}</span>
      </div>
    </div>
    ${aperta ? `<dl class="rp-dettagli">
      ${dett("Headline", p.titolo)}${dett("Città", p.citta)}
      ${az ? dett("Azienda (AIDA)", [az.settore || az.ateco, az.fatturato && "fatturato " + az.fatturato, az.dipendenti && az.dipendenti + " dipendenti"].filter(Boolean).join(" · ")) : ""}
      ${dett("Competenze", p.competenze)}${dett("Passioni", x.passioni)}${dett("Settori", x.settori)}
      ${dett("Ruolo nel team", x.ruoloNelTeam)}${dett("Cosa cerca", x.cosaCerco)}${dett("Idee", x.ideeMie)}
      ${p.lavori && p.lavori.length ? `<dt>Esperienze</dt><dd>${p.lavori.slice(0, 8).map((l) => `<div class="persona-lavoro"><b>${esc(l.ruolo)}</b> @ ${l.sito ? `<a href="${esc(l.sito)}" target="_blank" rel="noopener">${esc(l.azienda)}</a>` : esc(l.azienda)}
          <span class="piccolo">${esc(l.periodo.replace(/\s*\(.*\)$/, ""))}${l.settore ? " · " + esc(l.settore) : ""}</span>
          ${l.descrizioneAzienda ? `<div class="piccolo">${esc(l.descrizioneAzienda)}</div>` : ""}
          ${l.descrizioneRuolo ? `<div class="piccolo">${esc(l.descrizioneRuolo.slice(0, 280))}${l.descrizioneRuolo.length > 280 ? "…" : ""}</div>` : ""}</div>`).join("")}</dd>`
        : dett("Esperienze", (p.esperienze || "").slice(0, 600) + ((p.esperienze || "").length > 600 ? "…" : ""))}
      ${dett("Formazione", p.formazione)}
    </dl>` : ""}
  </div>`;
}

// Il pezzetto di testo dove compare la prima parola cercata, con la parola
// evidenziata: serve a capire perche' una persona e' nei risultati.
function dovePersona(p, filtro) {
  const w = senzaAccenti(filtro).split(/\s+/).filter(Boolean)[0];
  if (!w) return "";
  const re = new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const x = p.extra || {};
  for (const campo of [p.nome, p.ruolo, p.azienda, p.titolo, p.competenze, x.passioni, x.settori, x.cosaCerco, p.esperienze, p.formazione, p.linkedinTesto]) {
    const t = String(campo || "").replace(/\s+/g, " ");
    const m = re.exec(senzaAccenti(t));
    if (!m) continue;
    const i = m.index + m[1].length;
    const da = Math.max(0, i - 50), a = Math.min(t.length, i + w.length + 60);
    return esc(t.slice(da, i)) + "<mark>" + esc(t.slice(i, i + w.length)) + "</mark>" + esc(t.slice(i + w.length, a));
  }
  return "";
}

// La ricerca vuole parole che INIZIANO come quelle scritte: "ducati" trova
// Ducati ma non "education". Con piu' parole, devono esserci tutte.
const senzaAccenti = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function trovaPersona(filtro) {
  const parole = senzaAccenti(filtro).split(/\s+/).filter(Boolean)
    .map((w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")));
  if (!parole.length) return () => true;
  return (p) => {
    const x = p.extra || {}, a = p.aziendaInfo || {};
    const testo = senzaAccenti([p.nome, p.titolo, p.ruolo, p.azienda, p.citta, p.competenze, p.esperienze, p.formazione,
      p.linkedinTesto, x.passioni, x.preferenza, x.settori, x.ruoloNelTeam, x.cosaCerco, x.ideeMie, a.settore, a.ateco].join(" \n "));
    return parole.every((re) => re.test(testo));
  };
}

// ---------------------------------------------------------------- genera
// I due motori. Ogni generazione costa un credito (l'amministratore non ne
// consuma). Le idee proposte si selezionano (da 1 a 5) e si condividono in
// bacheca con tutti o solo con le persone scelte.
function testoCrediti() {
  const c = S.dati.io.crediti;
  if (!c) return `<span class="etichetta verde">Crediti illimitati</span>`;
  return `<span class="etichetta ${c.restano ? "" : "ambra"}">Ti ${c.restano === 1 ? "resta 1 credito" : "restano " + c.restano + " crediti"} su ${c.totale}</span>`;
}
function senzaCrediti() { const c = S.dati.io.crediti; return !!c && c.restano <= 0; }

  ["persone", "Ci sono persone con cui mi piacerebbe lavorare, ma non ho ancora un'idea", "Sceglile: Claude genera idee compatibili con i vostri profili."],

      <label>Da dove partire <small>(le cinque strade indicate da Venezia)</small></label>

// Barre da 1 a 10; sotto 6 la barra diventa ambra, perche' e' sotto la soglia.
function barreCriteri(titolo, voci) {
  return `<div class="criteri">${titolo ? `<div class="criteri-titolo">${esc(titolo)}</div>` : ""}${voci.map(([t, v]) => {
    const n = Math.max(0, Math.min(10, Number(v) || 0));
    return `<div class="criterio ${n < 6 ? "debole" : ""}"><span>${t}</span><span class="livello"><span style="width:${n * 10}%"></span></span><b>${esc(v)}</b></div>`;
  }).join("")}</div>`;
}

    titolo: i.titolo, modello: i.modello, settore: i.settore, generata: true, generazione: gid,

      i.scalabilita && "Scalabile: " + i.scalabilita, i.replicabilita && "Replicabile: " + i.replicabilita,
      i.startup_innovativa && "Startup innovativa: " + i.startup_innovativa.requisito + " (" + i.startup_innovativa.come + ")",

      .filter((x) => x !== undefined && x !== null && x !== false).join("\n"),
    compagni: (i.compagni || []).map((c) => c.id),
    // con i nomi: si aggiunge solo se la proposta va alle persone che contiene
    perche: i.perche_noi || "",
    proposta: [
      ...(g.persone || []).filter((id) => profilo(id)).map((id) => ({ id, motivo: ((i.ruoli || []).find((r) => r.id === id) || {}).ruolo || "Scelto da te per lavorare insieme", scelto: true })),
      ...(i.compagni || []).filter((c) => profilo(c.id)).map((c) => ({ id: c.id, motivo: c.motivo || "" })),

function barraSelezione() {
  if (!S.selezione.size) return "";
  return `<div class="carta scelti riga"><b>${S.selezione.size} ${S.selezione.size === 1 ? "idea selezionata" : "idee selezionate"}</b>

document.addEventListener("change", (ev) => {
  const c = ev.target.closest("[data-seleziona]");
  if (!c) return;
  const k = c.dataset.seleziona;
  if (c.checked) {

    S.selezione.add(k);

});
document.addEventListener("click", (ev) => {
  const una = ev.target.closest("[data-condividi-una]");
  if (una) {
    const i = ideaGenerata(una.dataset.condividiUna);
    if (i) apriEditor({ idee: [i], suggeriti: i.compagni, proposta: i.proposta });
    return;
  }
  if (ev.target.closest("[data-condividi-sel]")) {
    const idee = [...S.selezione].map(ideaGenerata).filter(Boolean);
    const proposta = [];
    idee.forEach((i) => i.proposta.forEach((x) => { if (!proposta.some((y) => y.id === x.id)) proposta.push(x); }));
    apriEditor({ idee, suggeriti: [...new Set(idee.flatMap((i) => i.compagni || []))], proposta, daSelezione: true });
    return;
  }
  if (ev.target.closest("[data-svuota-sel]")) { S.selezione.clear(); genera(); }
});

function apriEditor(post) {
  const idee = (post.idee && post.idee.length ? post.idee : [{}]).map((x) => ({ ...x }));
  // Le persone di una proposta generata (o, modificando un post, quelle con

  // tutto il master senza nomi.
  const proposta = post.proposta || Object.entries(post.motivi || {}).map(([id, motivo]) => ({ id, motivo }));
  const conProposta = proposta.length > 0;
  const destinatari = new Set(post.destinatari || (post.id ? [] : proposta.map((x) => x.id)));
  let visibilita = post.visibilita || (conProposta ? "scelti" : "tutti");
  const velo = document.createElement("div");
  velo.className = "velo";
  document.body.appendChild(velo);
  document.body.classList.add("bloccato");
  const chiudi = () => { velo.remove(); document.body.classList.remove("bloccato"); if (tour) setTimeout(tourMostra, 60); };
  document.querySelectorAll(".tour-anello,.tour-fumetto,.tour-velo").forEach((e) => e.remove());   // il tutorial aspetta
  const leggiBlocchi = () => velo.querySelectorAll(".blocco-idea").forEach((b, n) => {
    idee[n].titolo = b.querySelector("[data-f=titolo]").value;
    idee[n].descrizione = b.querySelector("[data-f=descrizione]").value;
    idee[n].modello = b.querySelector("[data-f=modello]").value;
    idee[n].settore = b.querySelector("[data-f=settore]").value;
  });
  const disegnaE = () => {
    velo.innerHTML = `<div class="finestra" role="dialog" aria-modal="true">
      <div class="riga"><h2 style="margin:0">${post.id ? "Modifica" : "Pubblica in bacheca"}</h2><span class="spazio"></span><button class="btn piccolo" data-chiudi>×</button></div>
      <label>Titolo del post <small>(facoltativo${idee.length > 1 ? ", ad esempio «Le nostre 3 idee sul food»" : ""})</small></label>
      <input type="text" id="eTitolo" value="${esc(post.titolo || "")}" placeholder="${esc(idee.length === 1 ? (idee[0].titolo || "") : idee.length + " idee")}">
      ${idee.map((i, n) => `<div class="blocco-idea">

// ---------------------------------------------------------------- PDF di LinkedIn
// pdf.js e' ospitato sul sito (public/vendor/pdfjs) e si carica solo quando
// serve: pesa 1,7 MB e la maggior parte delle visite non lo usa.
let pdfjsPronto = null;
function caricaPdfjs() {
  if (!pdfjsPronto) pdfjsPronto = import("/vendor/pdfjs/pdf.min.mjs").then((m) => {
    m.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs";
    return m;
  });
  return pdfjsPronto;
}
// Legge il PDF che LinkedIn genera da «Altro → Salva come PDF». La pagina ha
// una colonna laterale (contatti, competenze, lingue) e una principale (nome,
// headline, localita', poi le sezioni). Titoli e sezioni si riconoscono dalla
// dimensione del carattere, non dalle parole: cosi' funziona anche con i
// profili in inglese, tedesco o francese.
async function estraiProfiloPdf(pdfjs, dati) {
  const doc = await pdfjs.getDocument({ data: dati }).promise;
  const lato = [], centro = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const pag = await doc.getPage(n);
    const larghezza = pag.getViewport({ scale: 1 }).width;
    const cont = await pag.getTextContent();
    const righe = new Map();
    for (const it of cont.items) {
      if (!it.str || !it.str.trim() || it.height < 10) continue;   // sotto i 10 punti: numeri di pagina
      const x = it.transform[4], y = Math.round(it.transform[5]);
      const col = x < larghezza * 0.3 ? "l" : "c";
      const k = col + ":" + y;
      if (!righe.has(k)) righe.set(k, { col, y, h: 0, pezzi: [] });
      const r = righe.get(k);
      r.pezzi.push({ x, s: it.str });
      r.h = Math.max(r.h, it.height);
    }
    [...righe.values()].sort((a, b) => b.y - a.y).forEach((r) => {
      const t = r.pezzi.sort((a, b) => a.x - b.x).map((p) => p.s).join(" ").replace(/\s+/g, " ").trim();
      (r.col === "l" ? lato : centro).push({ t, h: r.h, pag: n });
    });
  }
  if (!centro.length) throw new Error("il PDF non contiene testo: va salvato da LinkedIn con Altro → Salva come PDF, non stampato");

  // Colonna principale: nome (carattere grande), poi headline e localita',
  // poi sezioni con titolo di corpo medio.
  const hMax = Math.max(...centro.filter((r) => r.pag === 1).map((r) => r.h));
  const eNome = (r) => r.pag === 1 && r.h >= hMax - 1;
  const eTitolo = (r) => !eNome(r) && r.h >= 14.5;
  let i = 0;
  const nome = [];
  while (i < centro.length && eNome(centro[i])) nome.push(centro[i++].t);
  const testa = [];
  while (i < centro.length && !eTitolo(centro[i])) testa.push(centro[i++].t);
  const sezioni = [];
  for (; i < centro.length; i++) {
    if (eTitolo(centro[i])) sezioni.push({ titolo: centro[i].t, righe: [] });
    else if (sezioni.length) sezioni[sezioni.length - 1].righe.push(centro[i].t);
  }
  const sez = (re) => sezioni.filter((s) => re.test(s.titolo)).map((s) => s.righe.join("\n")).join("\n");

  // Colonna laterale: titoli a corpo 13, voci a corpo 11.
  const hLato = lato.length ? Math.max(...lato.map((r) => r.h)) : 0;
  const blocchi = [];
  for (const r of lato) {
    if (r.h >= hLato - 0.5) blocchi.push({ titolo: r.t, righe: [] });
    else if (blocchi.length) blocchi[blocchi.length - 1].righe.push(r.t);
  }
  const competenze = blocchi.filter((b) => /competenze|skills|kenntnisse|comp[ée]tences|aptitudes/i.test(b.titolo))
    .flatMap((b) => b.righe).join(", ");
  const li = /linkedin\.com\/in\/[A-Za-z0-9\-_%]+/i.exec(lato.map((r) => r.t).join("").replace(/\s+/g, ""));

  return {
    nome: nome.join(" ").trim(),
    titolo: testa.slice(0, -1).join(" ").trim() || testa.join(" ").trim(),
    citta: testa.length > 1 ? testa[testa.length - 1] : "",
    linkedin: li ? "https://www." + li[0].replace(/^linkedin/i, "linkedin") + "/" : "",
    competenze,
    riepilogo: sez(/riepilogo|summary|zusammenfassung|r[ée]sum[ée]|resumen|info/i).replace(/\n/g, " "),
    esperienze: sez(/esperienz|experience|berufserfahrung|exp[ée]rience|experiencia/i),
    formazione: sez(/formazione|istruzione|education|ausbildung|formation|educaci[oó]n/i),
    testo: lato.concat(centro).map((r) => r.t).join("\n"),
  };
}

async function leggiPdfLinkedin(file) {
  const pdfjs = await caricaPdfjs();
  return estraiProfiloPdf(pdfjs, new Uint8Array(await file.arrayBuffer()));
}

// "Chi sei?": la prima cosa che vede chi entra e non e' stato riconosciuto
// dal nome Google. Si scrive il nome e il menu completa, come nella mappa del
// vino; frecce e Invio funzionano, poi si conferma.
function collega() {
  const tutti = S.dati.profili;
  $main.innerHTML = `<div class="chi-sei carta">
    <h2>Chi sei?</h2>
    <p class="sotto">Scrivi il tuo nome e sceglilo dall'elenco: così colleghiamo il tuo account al tuo profilo del master.</p>
    <div class="completa">
      <input type="text" id="cercaMe" placeholder="Nome e cognome" autocomplete="off" value="${esc(S.dati.io.nome || "")}">
      <div class="suggerimenti" id="sugg"></div>
    </div>
    <div id="conferma"></div>
    <div id="msgCol"></div>
    <details style="margin-top:18px"><summary class="piccolo">Non sono nell'elenco</summary>
      <label>Nome e cognome</label><input type="text" id="nNome" value="${esc(S.dati.io.nome)}">
      <label>Link al tuo profilo LinkedIn</label><input type="text" id="nLi" placeholder="https://www.linkedin.com/in/…">
      <div class="riga" style="margin-top:12px"><button class="btn" id="nCrea">Crea il mio profilo</button></div>
    </details>
  </div>`;
  const inp = document.getElementById("cercaMe"), box = document.getElementById("sugg");
  let trovati = [], sel = 0;
  const scegli = (p) => {
    box.innerHTML = ""; inp.value = p.nome;
    document.getElementById("conferma").innerHTML = `<div class="avviso info riga" style="margin-top:14px">
      <div class="avatar piccolo-av">${esc(iniziali(p.nome))}</div>
      <div style="flex:1;min-width:0"><b>${esc(p.nome)}</b><div class="piccolo">${esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || p.titolo || "")}</div></div>
      <button class="btn primario" data-rivendica="${p.id}">Sì, sono io</button></div>`;
  };
  const mostra = () => {
    document.getElementById("conferma").innerHTML = "";
    const parole = senzaAccenti(inp.value).split(/[\s'’-]+/).filter(Boolean);
    trovati = !parole.length ? [] : tutti.filter((p) => {
      const n = senzaAccenti(p.nome).split(/[\s'’,.-]+/);
      return parole.every((w) => n.some((x) => x.startsWith(w)));
    }).sort((x, y) => Number(!!x.rivendicato) - Number(!!y.rivendicato)).slice(0, 8);
    sel = trovati.findIndex((p) => !p.rivendicato);
    box.innerHTML = trovati.map((p, i) => `<div class="sugg ${i === sel ? "attivo" : ""} ${p.rivendicato ? "preso" : ""}" data-i="${i}">
      <b>${esc(p.nome)}</b> <span class="piccolo">${p.rivendicato ? "già collegato a un altro account" : esc([p.ruolo, p.azienda].filter(Boolean).join(" · ") || (p.titolo || "").slice(0, 70))}</span></div>`).join("")
      || (parole.length ? '<div class="sugg preso">Nessun nome così: prova con il cognome, oppure «Non sono nell\'elenco» qui sotto.</div>' : "");
  };
  inp.oninput = mostra;
  inp.onkeydown = (e) => {
    if (!trovati.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const liberi = trovati.map((p, i) => (p.rivendicato ? -1 : i)).filter((i) => i >= 0);
      if (!liberi.length) return;
      const k = liberi.indexOf(sel);
      sel = liberi[(k + (e.key === "ArrowDown" ? 1 : liberi.length - 1)) % liberi.length];
      box.querySelectorAll(".sugg").forEach((el, i) => el.classList.toggle("attivo", i === sel));
    } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); scegli(trovati[sel]); }
  };
  box.onmousedown = (e) => {
    const el = e.target.closest("[data-i]");
    if (!el) return;
    e.preventDefault();
    const p = trovati[Number(el.dataset.i)];
    if (p && !p.rivendicato) scegli(p);
  };
  mostra(); inp.focus(); inp.select();
  document.getElementById("nCrea").onclick = async () => {
    try { await api("nuovo-profilo", { nome: document.getElementById("nNome").value, linkedin: document.getElementById("nLi").value }); S.dati = await api("dati"); S.scheda = "profilo"; disegna(); }
    catch (e) { avvisa("msgCol", e.message, "male"); }
  };
}
document.addEventListener("click", async (ev) => {
  const id = ev.target.dataset && ev.target.dataset.rivendica;
  if (!id) return;
  try { await api("rivendica", { id }); S.dati = await api("dati"); S.scheda = "profilo"; disegna(); }
  catch (e) { avvisa("msgCol", e.message, "male"); }
});

// ---------------------------------------------------------------- spunti
// Idee da cui partire, dalle due fonti citate da Claudio Venezia:
// - Y Combinator: le aziende della directory pubblica. Il file sta sul sito
//   (spunti-yc.json, circa 3.500 aziende) e si carica solo aprendo la scheda.
// - TechCrunch: le ultime notizie su startup e raccolte fondi, lette dai feed
//   RSS tramite /api/spunti-tc (in cache per un'ora).
// "Usa come spunto" porta l'azienda o l'articolo nelle indicazioni del generatore.
const FONTI_SPUNTI = [["yc", "Y Combinator"], ["tc", "TechCrunch"]];
function testaSpunti() {
  return `<h2>Spunti</h2>
    <p class="sotto">Per trovare idee Claudio Venezia consiglia di guardare cosa fanno le startup della Silicon Valley, su <b>Y Combinator</b> e su <b>TechCrunch</b>. Trova un modello o una notizia che ti incuriosisce e premi <b>Usa come spunto</b>: Claude lo userà per proporti idee adattate al vostro gruppo.</p>
    <div class="fonti">${FONTI_SPUNTI.map(([k, t]) => `<button data-fonte="${k}" class="${(S.fonteSpunti || "yc") === k ? "attiva" : ""}">${t}</button>`).join("")}</div>`;
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-fonte]");
  if (!b) return;
  S.fonteSpunti = b.dataset.fonte; spunti();
});
async function spunti() {
  if (S.fonteSpunti === "tc") return spuntiTC();
  if (!S.yc) {
    $main.innerHTML = testaSpunti() + '<div class="caricamento">Carico le aziende di Y Combinator…</div>';
    try { S.yc = await (await fetch("/spunti-yc.json")).json(); }
    catch (e) { $main.innerHTML = testaSpunti() + `<div class="avviso male">Non riesco a caricare gli spunti: ${esc(e.message)}</div>`; return; }
    if (S.fonteSpunti === "tc") return;   // nel frattempo si e' passati a TechCrunch
  }
  const F = S.filtriSpunti = S.filtriSpunti || { q: "", settore: "", zona: "", periodo: "", top: false, quanti: 60 };
  const tutte = S.yc.aziende;
  const settori = [...new Set(tutte.map((x) => x.i).filter(Boolean))].sort();
  const parole = senzaAccenti(F.q).split(/\s+/).filter(Boolean);
  const lista = tutte.filter((x) => {
    if (F.settore && x.i !== F.settore) return false;
    if (F.zona === "eu" && !x.r.includes("Europe")) return false;
    if (F.zona === "us" && !x.r.some((r) => /America|United States/.test(r))) return false;
    if (F.zona === "remote" && !x.r.includes("Remote")) return false;
    if (F.periodo && !(F.periodo === "top" ? x.top : x.a >= Number(F.periodo))) return false;
    if (F.top && !x.top) return false;
    if (!parole.length) return true;
    const t = senzaAccenti([x.n, x.o, x.d, x.i, x.si, x.t.join(" ")].join(" "));
    return parole.every((w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(t));
  });
  if (F.periodo === "top") lista.sort((a, b) => (b.ts || 0) - (a.ts || 0));   // le piu' grandi, cioe' le piu' note, per prime
  const sel = (id, opzioni, v) => `<select id="${id}">${opzioni.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  $main.innerHTML = testaSpunti() + `
    <div class="riga piccolo" style="margin-bottom:12px">Guarda anche la <a href="https://www.ycombinator.com/companies" target="_blank" rel="noopener">directory di Y Combinator</a></div>
    <div class="filtri-spunti">
      <input type="search" id="spQ" placeholder="Cerca in inglese: food, logistics, energy, AI, health…" value="${esc(F.q)}">
      ${sel("spSettore", [["", "Tutti i settori"], ...settori.map((x) => [x, x])], F.settore)}
      ${sel("spZona", [["", "Tutto il mondo"], ["eu", "Europa"], ["us", "Stati Uniti e Canada"], ["remote", "Da remoto"]], F.zona)}
      ${sel("spPeriodo", [["", "Tutti gli anni"], ["2025", "Dal 2025"], ["2023", "Dal 2023"], ["top", "Le più affermate (Airbnb, Stripe…)"]], F.periodo)}
    </div>
    <p class="piccolo">${lista.length.toLocaleString("it-IT")} aziende${lista.length > F.quanti ? `, ne vedi ${F.quanti}` : ""} · fonte: ${esc(S.yc.fonte)}, aggiornata al ${esc(S.yc.aggiornato)}</p>
    <div class="griglia">${lista.slice(0, F.quanti).map((x, k) => `<div class="carta spunto">
      <div class="riga"><b>${esc(x.n)}</b>${x.top ? '<span class="etichetta verde">top</span>' : ""}<span class="spazio"></span><span class="piccolo">${esc(x.b)}</span></div>
      <div class="spunto-uno">${esc(x.o)}</div>
      ${x.d ? `<div class="piccolo">${esc(x.d)}</div>` : ""}
      <div>${[x.i, x.si].filter(Boolean).filter((v, n, a) => a.indexOf(v) === n).map((t) => `<span class="etichetta grigia">${esc(t)}</span>`).join("")}${x.st === "Acquired" ? '<span class="etichetta ambra">acquisita</span>' : ""}</div>
      <div class="riga piccolo" style="margin-top:auto">${x.l ? esc(x.l) + " · " : ""}${x.w ? `<a href="${esc(x.w)}" target="_blank" rel="noopener">sito</a> · ` : ""}<a href="https://www.ycombinator.com/companies/${esc(x.s)}" target="_blank" rel="noopener">scheda YC</a>
        <span class="spazio"></span><button class="btn piccolo primario" data-spunto="${tutte.indexOf(x)}">Usa come spunto</button></div>
    </div>`).join("") || '<p class="piccolo">Nessuna azienda con questi filtri.</p>'}</div>
    ${lista.length > F.quanti ? `<div style="text-align:center;margin-top:14px"><button class="btn" id="spAltri">Mostra altre</button></div>` : ""}`;
  const q = document.getElementById("spQ");
  q.oninput = () => { F.q = q.value; F.quanti = 60; clearTimeout(S.tSp); S.tSp = setTimeout(() => { const pos = q.selectionStart; spunti().then(() => { const n = document.getElementById("spQ"); n.focus(); n.setSelectionRange(pos, pos); }); }, 250); };
  [["spSettore", "settore"], ["spZona", "zona"], ["spPeriodo", "periodo"]].forEach(([id, k]) => {
    document.getElementById(id).onchange = (e) => { F[k] = e.target.value; F.quanti = 60; spunti(); };
  });
  const altri = document.getElementById("spAltri");
  if (altri) altri.onclick = () => { F.quanti += 60; const y = window.scrollY; spunti().then(() => window.scrollTo(0, y)); };
}

      ${a.sintesi ? `<div class="sintesi">${esc(a.sintesi)}</div>` : ""}
      <div>${a.categorie.map((c) => `<span class="etichetta grigia">${esc(c)}</span>`).join("")}</div>

async function regia(daCache) {

// Come genera Claude e quanto costa: modello ed effort si cambiano qui, e la
// tabella dice quanto e' costata in media ogni generazione con ciascuna scelta
// (proposta + approfondimenti), con la proiezione su 500 generazioni.
const NOMI_MODELLI = { "claude-opus-5": "Claude Opus 5 (il più bravo)", "claude-sonnet-5": "Claude Sonnet 5 (circa 60% in meno)" };
const NOMI_EFFORT = { low: "basso (ragiona poco, costa meno)", medium: "medio", high: "alto (ragiona di più, costa di più)" };
function pannelloCosti(s) {
  const i = s.impostazioni;
  if (!i) return "";
  const sel = (id, voci, nomi, v) => `<select id="${id}">${voci.map((x) => `<option value="${x}" ${x === v ? "selected" : ""}>${esc(nomi[x] || x)}</option>`).join("")}</select>`;
  const righe = (s.costiMedi || []).sort((a, b) => b.generazioni - a.generazioni);
  return `<details class="carta" style="margin-top:12px" ${S.costiAperti ? "open" : ""} id="pannelloCosti"><summary><b>Costi e modello</b> <span class="piccolo">· ora: ${esc(NOMI_MODELLI[i.modello] || i.modello)}, effort ${esc(i.effort)}</span></summary>
    <div class="due" style="margin-top:10px">
      <div><label>Modello</label>${sel("impModello", i.modelli, NOMI_MODELLI, i.modello)}</div>
      <div><label>Effort (quanto ragiona prima di scrivere)</label>${sel("impEffort", i.livelli || ["low", "medium", "high"], NOMI_EFFORT, i.effort)}</div>
    </div>
    <div class="riga" style="margin-top:8px"><button class="btn primario" id="salvaImp">Salva</button><span class="piccolo" id="msgImp"></span></div>
    <p class="piccolo" style="margin-top:12px">Costo medio reale per generazione, dai token che riporta l'API. La proposta è il passo 1 (5 idee brevi, 1 credito); gli approfondimenti si pagano solo sulle idee aperte.</p>
    ${righe.length ? `<table><tr><th>Modello · effort</th><th>Generazioni</th><th>Proposta</th><th>Approfondimento</th><th>Media totale</th><th>500 generazioni</th></tr>
      ${righe.map((r) => `<tr><td>${esc(r.chiave)}</td><td>${r.generazioni}</td><td>${usd(r.mediaProposta, 3)}</td>
        <td>${r.mediaApprofondimento == null ? "—" : usd(r.mediaApprofondimento, 3) + ` <span class="piccolo">× ${String(r.approfondimentiPerGenerazione).replace(".", ",")}</span>`}</td>
        <td><b>${usd(r.mediaTotale, 3)}</b></td><td>${usd(r.mediaTotale * 500, 0)}</td></tr>`).join("")}</table>`
      : '<p class="piccolo">Ancora nessuna generazione con il dato di costo.</p>'}
  </details>`;
}
document.addEventListener("toggle", (ev) => { if (ev.target.id === "pannelloCosti") S.costiAperti = ev.target.open; }, true);
document.addEventListener("click", async (ev) => {

// senza sito o con dubbi stanno in cima, da sistemare a mano. Per ognuna:

const STATI_AZ = { mancante: "senza sito", dubbio: "dubbio", trovata: "trovata", verificata: "verificata", ignorata: "non è un'azienda" };
async function aziende(daCache) {

  const q = senzaAccenti(F.q);

    (!q || senzaAccenti([a.nome, a.scritto, a.settore, a.persone.map((x) => x.nome + " " + x.ruolo).join(" ")].join(" ")).includes(q)));

      <span class="spazio"></span><button class="btn" id="aggAz">Aggiorna</button></div>
    <div class="riga" style="margin-bottom:10px">
      ${bott("sistemare", "Da sistemare", conta(daSistemare))}${bott("trovata", "Trovate", conta((a) => a.stato === "trovata"))}
      ${bott("verificata", "Sistemate a mano", conta((a) => a.stato === "verificata"))}${bott("ignorata", "Non aziende", conta((a) => a.stato === "ignorata"))}
      ${bott("tutte", "Tutte", d.aziende.length)}
      <span class="spazio"></span><input type="search" id="cercaAz" placeholder="Cerca azienda, persona, settore…" value="${esc(F.q)}" style="max-width:280px"></div>
    ${lista.slice(0, F.quanti).map((a) => `<div class="carta" style="margin-bottom:10px" data-az="${esc(a.chiave)}">
      <div class="riga"><b>${esc(a.scritto)}</b>${a.nome && a.nome !== a.scritto ? `<span class="piccolo">(${esc(a.nome)})</span>` : ""}
        <span class="stato-az ${a.stato}">${STATI_AZ[a.stato]}</span>${a.fiducia && !a.manuale ? `<span class="piccolo">fiducia ${esc(a.fiducia)}</span>` : ""}
        ${a.manuale ? '<span class="piccolo">modificata a mano</span>' : ""}<span class="spazio"></span>
        ${a.sito ? `<a class="piccolo" href="${esc(a.sito)}" target="_blank" rel="noopener">apri il sito</a>` : `<a class="piccolo" href="https://www.google.com/search?q=${encodeURIComponent(a.scritto)}" target="_blank" rel="noopener">cerca su Google</a>`}</div>
      ${a.nota ? `<div class="piccolo" style="color:var(--ambra)">${esc(a.nota)}</div>` : ""}
      <div class="due" style="margin-top:6px">
        <div><label>Nome</label><input type="text" data-c="nome" value="${esc(a.nome || a.scritto)}"></div>
        <div><label>Sito</label><div class="riga" style="flex-wrap:nowrap"><input type="text" data-c="sito" value="${esc(a.sito || "")}" placeholder="https://…"><button class="btn piccolo" data-leggi-sito>Leggi dal sito</button></div></div>
      </div>
      <label>Settore</label><input type="text" data-c="settore" value="${esc(a.settore || "")}" placeholder="es. macchine per il packaging">

      <details style="margin-top:8px" ${daSistemare(a) ? "open" : ""}><summary class="piccolo">Chi ci ha lavorato (${a.persone.length}) e cosa faceva</summary>
        ${a.persone.map((x) => `<div class="persona-lavoro" data-ruolo="${esc(x.id)}" data-profilo="${esc(x.profilo)}"><b>${esc(x.nome)}</b> · ${esc(x.ruolo)} <span class="piccolo">${esc(x.periodo.replace(/\s*\(.*\)$/, ""))}</span>

      <div class="riga" style="margin-top:8px"><button class="btn primario" data-salva-az>Salva</button>

document.addEventListener("click", async (ev) => {
  const f = ev.target.closest("[data-filtro-az]");

  const chiave = carta.dataset.az, msg = carta.querySelector("[data-msg-az]");

  const a = S.aziende.aziende.find((x) => x.chiave === chiave);

    msg.textContent = "Leggo il sito…";

    const perProfilo = {};
    carta.querySelectorAll("[data-ruolo]").forEach((r) => {
      const t = r.querySelector("textarea").value, prima = (a.persone.find((x) => x.id === r.dataset.ruolo && x.profilo === r.dataset.profilo) || {}).descrizioneRuolo || "";
      if (t !== prima) (perProfilo[r.dataset.profilo] = perProfilo[r.dataset.profilo] || []).push({ id: r.dataset.ruolo, descrizioneRuolo: t });
    });

    S.aziende = await api("aziende-lavoro");
    const y = window.scrollY; await aziende(true); window.scrollTo(0, y);
  } catch (e) { msg.textContent = e.message; }
});

// Dollari: due decimali, tre per i costi piccoli di una singola generazione.
const usd = (v, dec = 2) => "$" + Number(v || 0).toLocaleString("it-IT", { minimumFractionDigits: dec, maximumFractionDigits: dec });

  { sel: '[data-tour="nuova"]', testo: "Qui pubblichi un'idea, o un gruppo fino a 5. Decidi tu se la vede <b>tutto il master</b> o <b>solo i compagni che scegli</b>." },

  { sel: '[data-scheda="spunti"]', testo: "Cerchi ispirazione? Nella scheda <b>Spunti</b> ci sono migliaia di startup di Y Combinator e le ultime notizie di TechCrunch: con <b>Usa come spunto</b> Claude parte da lì per le tue idee." },
  { sel: '[data-tour="crediti"]', testo: "Ogni generazione costa <b>1 credito</b>. Usali con calma: prima completa il profilo, le idee vengono meglio." },
  { testo: "<b>Fatto!</b> Quando Claude ti propone le idee, selezionane da 1 a 5 e premi <b>Condividi</b>.<br>Il tutorial lo ritrovi dal pulsante <b>?</b> in alto." },
];
let tour = null;
function tourAvvia() {
  if (!S.dati || !S.dati.io.profilo) return;
  tour = { i: 0 };
  S.scheda = "bacheca"; disegna(); window.scrollTo(0, 0);
}
function tourFine() {
  tour = null;
  document.querySelectorAll(".tour-anello,.tour-fumetto,.tour-velo").forEach((e) => e.remove());
  memoria("bbs-tutorial-" + S.dati.io.email, "1");
}
function tourMostra() {
  document.querySelectorAll(".tour-anello,.tour-fumetto,.tour-velo").forEach((e) => e.remove());
  if (!tour) return;
  if (document.querySelector(".velo")) return;   // c'e' una finestra aperta: il tutorial riprende quando si chiude
  const passo = TOUR[tour.i];
  if (!passo) return tourFine();
  const el = passo.sel ? document.querySelector(passo.sel) : null;
  if (passo.sel && !el) { tour.i++; return tourMostra(); }
  const fumetto = document.createElement("div");
  fumetto.className = "tour-fumetto";
  const ultimo = tour.i === TOUR.length - 1;
  fumetto.innerHTML = `<div class="piccolo">${tour.i + 1} di ${TOUR.length}</div><div class="tour-testo">${passo.testo}</div>
    <div class="riga" style="margin-top:10px">${ultimo ? "" : '<button class="btn piccolo" data-tour-salta>Salta il tutorial</button>'}<span class="spazio"></span>
    ${passo.azione ? '<span class="piccolo">👆 clicca il punto evidenziato</span>' : `<button class="btn primario piccolo" data-tour-avanti>${ultimo ? "Fine" : tour.i === 0 ? "Iniziamo" : "Avanti"}</button>`}</div>`;
  if (!el) {
    const velo = document.createElement("div"); velo.className = "tour-velo"; document.body.appendChild(velo);
    fumetto.classList.add("al-centro");
    document.body.appendChild(fumetto);
    return;
  }
  el.scrollIntoView({ block: "center" });
  const anello = document.createElement("div"); anello.className = "tour-anello";
  document.body.appendChild(anello); document.body.appendChild(fumetto);
  const posiziona = () => {
    const r = el.getBoundingClientRect(), m = 6;
    Object.assign(anello.style, { top: r.top - m + "px", left: r.left - m + "px", width: r.width + 2 * m + "px", height: r.height + 2 * m + "px" });
    const f = fumetto.getBoundingClientRect();
    const sotto = r.bottom + 14 + f.height < window.innerHeight;
    fumetto.style.top = (sotto ? r.bottom + 14 : Math.max(10, r.top - 14 - f.height)) + "px";
    fumetto.style.left = Math.max(10, Math.min(window.innerWidth - f.width - 10, r.left + r.width / 2 - f.width / 2)) + "px";
    fumetto.classList.toggle("sopra", !sotto);
  };
  posiziona();
  tour.posiziona = posiziona;
  if (passo.azione) el.addEventListener("click", () => { if (tour) { tour.i++; setTimeout(tourMostra, 80); } }, { once: true });
}

    ["Settori", (p) => (p.extra || {}).settori], ["Ruolo nel team", (p) => (p.extra || {}).ruoloNelTeam],
    ["Come vorrebbe il progetto", (p) => (p.extra || {}).cosaCerco], ["Idee sue", (p) => (p.extra || {}).ideeMie],
    ["Non vuole", (p) => (p.extra || {}).nonVoglio], ["Disponibilità", (p) => (p.extra || {}).disponibilita],
    ["AIDA settore", (p) => p.aziendaInfo && (p.aziendaInfo.settore || p.aziendaInfo.ateco)],
    ["AIDA fatturato", (p) => p.aziendaInfo && p.aziendaInfo.fatturato], ["AIDA dipendenti", (p) => p.aziendaInfo && p.aziendaInfo.dipendenti],
    ["Collegato", (p) => (p.rivendicato ? "sì" : "no")], ["Aggiornato", (p) => p.aggiornato],

  const cella = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';

}

// ---------------------------------------------------------------- importa (admin)
function leggiCsv(testo) {
  testo = testo.replace(/^﻿/, "");
  const prima = testo.split(/\r?\n/)[0] || "";
  const sep = [";", "\t", ","].sort((a, b) => prima.split(b).length - prima.split(a).length)[0];
  const righe = []; let riga = [], campo = "", virgolette = false;
  for (let i = 0; i < testo.length; i++) {
    const c = testo[i];
    if (virgolette) {
      if (c === '"' && testo[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') virgolette = false;
      else campo += c;
    } else if (c === '"') virgolette = true;
    else if (c === sep) { riga.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && testo[i + 1] === "\n") i++; riga.push(campo); righe.push(riga); riga = []; campo = ""; }
    else campo += c;
  }
  if (campo || riga.length) { riga.push(campo); righe.push(riga); }
  const testa = (righe.shift() || []).map((h) => h.trim());
  return righe.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(testa.map((h, i) => [h, (r[i] || "").trim()])));
}
// Nome colonna -> campo nostro, per regole (le esportazioni hanno intestazioni diverse).
function mappa(riga, regole) {
  const out = {}, altro = {};
  for (const [h, v] of Object.entries(riga)) {
    const k = h.toLowerCase();
    const r = regole.find(([re]) => re.test(k));
    if (r && !out[r[1]]) out[r[1]] = v; else if (v) altro[h] = v;
  }
  return [out, altro];
}
